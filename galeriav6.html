<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MaxiQueen OS | Media Hub Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* MaxiQueen OS Color Palette - Holographic & Futuristic */
            --bg-base: #030712;
            --glass-bg: rgba(17, 24, 39, 0.75);
            --glass-border: rgba(56, 189, 248, 0.2);
            --neon-primary: #38bdf8;
            --neon-accent: #facc15;
            --neon-danger: #f43f5e;
            --neon-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --sidebar-width: 260px;
            --panel-width: 320px;
            --transition-speed: 0.3s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-primary); }

        body {
            background: radial-gradient(circle at 50% -20%, #0f172a, var(--bg-base));
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        #app-container { display: flex; width: 100%; height: 100%; position: relative; }

        /* --- SIDEBAR --- */
        aside.sidebar {
            width: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            border-right: 1px solid var(--glass-border);
            z-index: 100;
            transition: transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        }
        .brand { padding: 0 20px 20px; border-bottom: 1px solid var(--glass-border); text-align: center; }
        .brand h1 { font-size: 1.4rem; font-weight: 900; color: var(--text-main); letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 15px var(--neon-primary); }
        .brand span { color: var(--neon-primary); }
        .brand p { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        .nav-menu { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            padding: 12px 15px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px;
            color: var(--text-muted); font-size: 0.95rem; font-weight: 500; transition: all 0.2s;
        }
        .nav-item i { width: 20px; text-align: center; font-size: 1.1rem; }
        .nav-item:hover, .nav-item.active { background: rgba(56, 189, 248, 0.15); color: var(--neon-primary); box-shadow: inset 2px 0 0 var(--neon-primary); }
        
        .stats-box { padding: 20px; border-top: 1px solid var(--glass-border); font-size: 0.8rem; color: var(--text-muted); background: rgba(0,0,0,0.2); }
        .stats-box div { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stats-box span:last-child { font-weight: bold; color: var(--text-main); }

        #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 90; backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.3s; }

        /* --- AREA CENTRAL --- */
        main.content-area { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
        
        header.topbar {
            height: 70px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--glass-border); z-index: 50; gap: 15px;
        }
        .menu-toggle { display: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer; background: transparent; border: none; outline: none; }
        
        .search-container { flex: 1; max-width: 500px; }
        .search-bar { 
            display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 25px; padding: 8px 18px; width: 100%; transition: border-color 0.3s, box-shadow 0.3s; 
        }
        .search-bar:focus-within { border-color: var(--neon-primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .search-bar input { background: transparent; border: none; color: white; outline: none; padding-left: 12px; width: 100%; font-size: 0.95rem; }
        
        .view-controls { display: flex; gap: 15px; }
        .view-controls button { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .view-controls button:hover, .view-controls button.active { color: var(--neon-primary); transform: scale(1.1); }

        /* Galería */
        .gallery-container { flex: 1; overflow-y: auto; padding: 25px; position: relative; scroll-behavior: smooth; }
        
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        
        .list-view { display: flex; flex-direction: column; gap: 12px; }
        .list-view .asset-card { display: flex; flex-direction: row; height: 90px; align-items: center; padding-right: 15px; }
        
        .list-view .media-wrapper { 
            width: 140px; 
            height: 100%; 
            aspect-ratio: auto; 
            border-bottom: none; 
            border-right: 1px solid var(--glass-border); 
        }

        .asset-card {
            background: rgba(15, 23, 42, 0.5); border: 1px solid var(--glass-border); border-radius: 14px;
            overflow: hidden; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative;
            display: flex; flex-direction: column;
        }
        .asset-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 15px rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.5); }
        .asset-card.selected { border-color: var(--neon-accent); box-shadow: 0 0 20px rgba(250, 204, 21, 0.2); background: rgba(250, 204, 21, 0.05); }
        
        .media-wrapper { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0;
        }
        .media-wrapper img, .media-wrapper video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
        .asset-card:hover .media-wrapper img, .asset-card:hover .media-wrapper video { transform: scale(1.05); }
        
        .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--glass-border); font-size: 0.65rem; padding: 4px 8px; border-radius: 6px; font-weight: bold; z-index: 2; backdrop-filter: blur(4px); }
        .fav-btn { position: absolute; top: 10px; right: 10px; color: rgba(255,255,255,0.6); font-size: 1.2rem; cursor: pointer; text-shadow: 0 2px 5px rgba(0,0,0,0.8); z-index: 2; transition: 0.2s; }
        .fav-btn:hover { transform: scale(1.1); }
        .fav-btn.active { color: var(--neon-amber); text-shadow: 0 0 12px var(--neon-amber); }

        .card-info { padding: 14px; width: 100%; }
        .card-title { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: var(--text-main); }
        .card-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; gap: 5px; }

        /* --- PANEL DERECHO (INFO) --- */
        aside.info-panel {
            width: var(--panel-width); border-left: 1px solid var(--glass-border); padding: 25px;
            display: flex; flex-direction: column; gap: 20px; overflow-y: auto;
            transform: translateX(100%); position: absolute; right: 0; top: 0; height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); z-index: 60; background: var(--bg-base);
        }
        aside.info-panel.active { transform: translateX(0); box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .panel-header h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .close-panel-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 5px; }
        .close-panel-btn:hover { color: var(--neon-danger); }

        .info-preview { width: 100%; height: 200px; border-radius: 12px; background: #000; border: 1px solid var(--glass-border); overflow: hidden; display: flex; align-items: center; justify-content: center;}
        .info-preview img, .info-preview video { width: 100%; height: 100%; object-fit: contain; }
        
        .info-details { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .info-details label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 12px; display: block; font-weight: 600; letter-spacing: 1px; }
        .info-details label:first-child { margin-top: 0; }
        .info-details div { font-size: 0.85rem; word-break: break-all; margin-top: 4px; color: var(--text-main); }
        
        .info-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; }
        .btn { padding: 10px; border: 1px solid var(--neon-primary); background: rgba(56, 189, 248, 0.05); color: var(--neon-primary); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { background: var(--neon-primary); color: #000; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .btn-danger { border-color: var(--neon-danger); color: var(--neon-danger); background: rgba(244, 63, 94, 0.05); }
        .btn-danger:hover { background: var(--neon-danger); color: #fff; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }

        /* --- LIGHTBOX MODAL --- */
        #lightbox {
            position: fixed; inset: 0; background: rgba(3, 7, 18, 0.98);
            z-index: 1000; display: none; flex-direction: column; opacity: 0; transition: opacity 0.3s;
        }
        #lightbox.active { display: flex; opacity: 1; }
        .lightbox-toolbar { height: 70px; display: flex; justify-content: flex-end; align-items: center; padding: 0 25px; gap: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); flex-wrap: wrap;}
        .lightbox-toolbar i { color: rgba(255,255,255,0.7); font-size: 1.3rem; cursor: pointer; transition: 0.2s; padding: 10px; }
        .lightbox-toolbar i:hover { color: var(--neon-primary); transform: scale(1.1); }
        .lightbox-content { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .lightbox-media { max-width: 90%; max-height: 85vh; object-fit: contain; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); font-size: 3rem; cursor: pointer; padding: 20px; transition: 0.3s; z-index: 10; }
        .nav-arrow:hover { color: #fff; text-shadow: 0 0 15px var(--neon-primary); }
        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }

        .empty-state { text-align: center; color: var(--text-muted); margin-top: 15vh; font-size: 1.1rem; width: 100%; grid-column: 1 / -1; }
        .empty-state i { margin-bottom: 15px; color: rgba(255,255,255,0.1); }
        
        /* Notificaciones (Toast) */
        #toast-container { position: fixed; bottom: 25px; right: 25px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: rgba(17, 24, 39, 0.95); border-left: 4px solid var(--neon-primary); padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 0.9rem; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: slideIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; display: flex; align-items: center; gap: 10px; }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* =========================================
           RESPONSIVE DESIGN (MÓVILES)
           ========================================= */
        @media (max-width: 900px) {
            .grid-view { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }

        @media (max-width: 768px) {
            .menu-toggle { display: block; } /* Mostrar botón menú */
            
            aside.sidebar { position: fixed; left: -100%; top: 0; height: 100%; background: var(--bg-base); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            aside.sidebar.active { transform: translateX(100%); }
            
            #sidebar-overlay.active { display: block; opacity: 1; }

            aside.info-panel { width: 100%; max-width: 100%; border-left: none; position: fixed; z-index: 100; padding: 20px 15px; }
            
            header.topbar { padding: 0 15px; gap: 10px; justify-content: flex-start; }
            .search-container { flex: 1; }
            .search-bar { padding: 8px 12px; }
            .view-controls { display: none; }
            
            .gallery-container { padding: 15px; }
            .grid-view { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            
            .lightbox-toolbar { padding: 0 10px; gap: 5px; height: auto; min-height: 60px; justify-content: center;}
            #lb-title { display: none; } /* Ocultar titulo en modal movil para ganar espacio */
            .nav-arrow { font-size: 2rem; padding: 10px; }
            #prev-btn { left: 5px; }
            #next-btn { right: 5px; }
        }

        @media (max-width: 480px) {
            .grid-view { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
            .brand h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div id="app-container">
    <aside class="sidebar glass" id="sidebar">
        <div class="brand">
            <h1>MaxiQueen OS</h1>
            <p>Media Hub Pro v6</p>
        </div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="setFilter('all', this)"><i class="fas fa-folder-open"></i> Todos los Archivos</div>
            <div class="nav-item" onclick="setFilter('image', this)"><i class="fas fa-image"></i> Imágenes</div>
            <div class="nav-item" onclick="setFilter('video', this)"><i class="fas fa-video"></i> Videos</div>
            <div class="nav-item" onclick="setFilter('favorites', this)"><i class="fas fa-star" style="color: var(--neon-accent)"></i> Favoritos</div>
            <div class="nav-item" onclick="setFilter('recent', this)"><i class="fas fa-clock"></i> Recientes</div>
            <hr style="border-color: var(--glass-border); margin: 10px 0;">
            <div class="nav-item" onclick="setFilter('trash', this)"><i class="fas fa-trash"></i> Papelera</div>
        </div>
        <div class="stats-box">
            <div><span>Archivos Totales:</span> <span id="stat-total">0</span></div>
            <div><span>Imágenes:</span> <span id="stat-img">0</span></div>
            <div><span>Videos:</span> <span id="stat-vid">0</span></div>
        </div>
    </aside>

    <main class="content-area">
        <header class="topbar glass">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            
            <div class="search-container">
                <div class="search-bar">
                    <i class="fas fa-search" style="color: var(--text-muted)"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por nombre, fecha o tipo..." oninput="handleSearch()">
                </div>
            </div>
            
            <div class="view-controls">
                <button onclick="changeSort()"><i class="fas fa-sort-alpha-down" title="Ordenar"></i></button>
                <button class="active" id="btn-grid" onclick="setView('grid')"><i class="fas fa-th" title="Vista Cuadrícula"></i></button>
                <button id="btn-list" onclick="setView('list')"><i class="fas fa-list" title="Vista Lista"></i></button>
            </div>
        </header>
        
        <div class="gallery-container" id="gallery">
            </div>
    </main>

    <aside class="info-panel glass" id="infoPanel">
        </aside>
</div>

<div id="lightbox">
    <div class="lightbox-toolbar">
        <span style="flex-grow: 1; color: white; font-weight: bold; font-family: monospace;" id="lb-title">Archivo</span>
        <i class="fas fa-search-minus" onclick="adjustZoom(-0.2)" title="Alejar"></i>
        <i class="fas fa-search-plus" onclick="adjustZoom(0.2)" title="Acercar"></i>
        <i class="fas fa-undo" onclick="resetTransforms()" title="Resetear Vista"></i>
        <i class="fas fa-sync-alt" onclick="rotateMedia()" title="Rotar"></i>
        <i class="fas fa-download" onclick="downloadCurrent()" title="Descargar"></i>
        <i class="fas fa-share-alt" onclick="shareCurrent()" title="Compartir"></i>
        <i class="fas fa-times" onclick="closeLightbox()" style="color: var(--neon-danger); font-size: 1.5rem; margin-left: 10px;" title="Cerrar"></i>
    </div>
    <div class="lightbox-content">
        <i class="fas fa-chevron-left nav-arrow" id="prev-btn" onclick="navigateMedia(-1)"></i>
        <div id="lb-media-container" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
            </div>
        <i class="fas fa-chevron-right nav-arrow" id="next-btn" onclick="navigateMedia(1)"></i>
    </div>
</div>

<div id="toast-container"></div>

<script>
    const BASE_URL = 'https://maxiqueen-os.vercel.app/assets/';
    
    const rawFiles = [
        "img/modulo-web.png", "200kvid.png", "Anatomia_del_protocolo3.png", "Animefamilia1.mp4", 
        "Animefamilia2.mp4", "Animefamilia3.mp4", "Cap3_tios_ladrones.png", "Cap4_Ladrona_Matrimpnio.png", 
        "Cap4_Ladrona_Matrimpnio_3.png", "Cap4_Ladrona_Matrimpnio_Cena.png", "Cap_Historia_Robo.png", 
        "Cap_Ladrona_Familia.png", "ChatGPT Image 29 ene 2026, 09_44_55 p.m..png", "ChatGPT Image 29 ene 2026, 09_45_01 p.m..png", 
        "ChatGPT Image 31 ene 2026, 11_50_38 p.m..png", "Estructura_Next.js.png", "MAXIQUEEN_LOGO.png", 
        "NotebookLM Mind Map (1).png", "NotebookLM Mind Map (2).png", "NotebookLM Mind Map (3).png", 
        "NotebookLM Mind Map (4).png", "NotebookLM Mind Map (5).png", "NotebookLM Mind Map.png", 
        "Video_Abue_001.mp4", "Video_Abue_002.mp4", "animate.mp4", "anime_logo.mp4", "automa.png", 
        "maxiqueen_Presentacion2.png", "maxiqueen_os_infografia_abril.png", "unnamed(10).jpg", 
        "unnamed(11).jpg", "unnamed(12).jpg", "unnamed(13).jpg", "unnamed(14).jpg", "unnamed(15).jpg", 
        "unnamed(16).jpg", "unnamed(17).jpg", "unnamed(18).jpg", "unnamed(6).jpg", "unnamed(7).jpg", 
        "unnamed(8).jpg", "unnamed(9).jpg", "unnamed.jpg", "unnamed.png", 
        "use-this-photo-as-reference-for-the-main-character.mp4", "video-1057055004149662.mp4", 
        "video-1065399399981889.mp4", "video-1065399403315222.mp4", "video-1065488583306304.mp4", "video_princesa.mp4"
    ];

    let db = JSON.parse(localStorage.getItem('mqos_media_db')) || {
        favorites: [], trash: [], customNames: {}, viewHistory: []
    };

    function saveDB() { localStorage.setItem('mqos_media_db', JSON.stringify(db)); }

    let mediaAssets = rawFiles.map(filename => {
        const isVideo = filename.toLowerCase().endsWith('.mp4');
        return {
            id: btoa(filename),
            filename: filename,
            url: BASE_URL + filename,
            type: isVideo ? 'video' : 'image',
            ext: filename.split('.').pop().toUpperCase(),
            displayName: db.customNames[btoa(filename)] || decodeURIComponent(filename), 
            dateAdded: new Date().toISOString()
        };
    });

    let currentState = {
        filter: 'all', searchQuery: '', sortAsc: true, viewMode: 'grid',
        selectedId: null, lightboxIndex: 0, lbZoom: 1, lbRotate: 0
    };

    let filteredAssets = [];

    // --- RENDERIZADO ---
    function init() {
        applyFiltersAndRender();
        updateStats();
    }

    function applyFiltersAndRender() {
        filteredAssets = mediaAssets.filter(asset => {
            const inTrash = db.trash.includes(asset.id);
            if (currentState.filter === 'trash') return inTrash;
            if (inTrash) return false; 

            if (currentState.filter === 'image' && asset.type !== 'image') return false;
            if (currentState.filter === 'video' && asset.type !== 'video') return false;
            if (currentState.filter === 'favorites' && !db.favorites.includes(asset.id)) return false;
            if (currentState.filter === 'recent' && !db.viewHistory.includes(asset.id)) return false;

            if (currentState.searchQuery) {
                return asset.displayName.toLowerCase().includes(currentState.searchQuery.toLowerCase());
            }
            return true;
        });

        filteredAssets.sort((a, b) => {
            let val = a.displayName.localeCompare(b.displayName);
            return currentState.sortAsc ? val : -val;
        });

        renderGallery();
    }

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        gallery.className = `gallery-container ${currentState.viewMode}-view`;
        gallery.innerHTML = '';

        if (filteredAssets.length === 0) {
            gallery.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open fa-3x" style="opacity:0.5; margin-bottom:20px;"></i><br>No hay archivos aquí</div>`;
            return;
        }

        filteredAssets.forEach((asset, index) => {
            const isFav = db.favorites.includes(asset.id);
            const card = document.createElement('div');
            card.className = `asset-card ${currentState.selectedId === asset.id ? 'selected' : ''}`;
            card.onclick = () => selectAsset(asset.id);
            card.ondblclick = () => openLightbox(index);

            let mediaTag = asset.type === 'video' 
                ? `<video src="${asset.url}#t=0.1" preload="metadata" loading="lazy"></video>`
                : `<img src="${asset.url}" loading="lazy" alt="${asset.displayName}">`;

            card.innerHTML = `
                <div class="media-wrapper">
                    <span class="badge">${asset.ext}</span>
                    <i class="fas fa-star fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${asset.id}')" title="Favorito"></i>
                    ${mediaTag}
                </div>
                <div class="card-info">
                    <div class="card-title" title="${asset.displayName}">${asset.displayName}</div>
                    <div class="card-meta">${asset.type === 'video' ? '🎬 Video' : '🖼️ Imagen'} | MaxiQueen OS</div>
                </div>
            `;
            gallery.appendChild(card);
        });
    }

    // --- CONTROLES UI Y MÓVIL ---
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function closeInfoPanel() {
        document.getElementById('infoPanel').classList.remove('active');
        currentState.selectedId = null;
        renderGallery();
    }

    function setFilter(filterType, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        currentState.filter = filterType;
        closeInfoPanel();
        if(window.innerWidth <= 768) toggleSidebar(); // Autocerrar menú en móvil
        applyFiltersAndRender();
    }

    function setView(mode) {
        currentState.viewMode = mode;
        document.getElementById('btn-grid').classList.toggle('active', mode === 'grid');
        document.getElementById('btn-list').classList.toggle('active', mode === 'list');
        renderGallery();
    }

    function changeSort() {
        currentState.sortAsc = !currentState.sortAsc;
        applyFiltersAndRender();
        showToast(`Ordenado ${currentState.sortAsc ? 'A-Z' : 'Z-A'}`);
    }

    function handleSearch() {
        currentState.searchQuery = document.getElementById('searchInput').value;
        applyFiltersAndRender();
    }

    // --- PANEL DE INFORMACIÓN ---
    function selectAsset(id) {
        currentState.selectedId = id;
        renderGallery(); 
        
        const asset = mediaAssets.find(a => a.id === id);
        const panel = document.getElementById('infoPanel');
        const inTrash = db.trash.includes(id);

        if (!db.viewHistory.includes(id)) {
            db.viewHistory.unshift(id);
            if(db.viewHistory.length > 20) db.viewHistory.pop();
            saveDB();
        }

        let mediaPreview = asset.type === 'video'
            ? `<video src="${asset.url}" controls></video>`
            : `<img src="${asset.url}">`;

        let actionButtons = inTrash 
            ? `<button class="btn" onclick="restoreFile('${asset.id}')"><i class="fas fa-trash-restore"></i> Restaurar</button>
               <button class="btn btn-danger" onclick="permanentlyDelete('${asset.id}')"><i class="fas fa-times"></i> Destruir</button>`
            : `<button class="btn" onclick="renameFile('${asset.id}')"><i class="fas fa-edit"></i> Renombrar</button>
               <button class="btn" onclick="copyToClipboard('${asset.url}')"><i class="fas fa-link"></i> Enlace</button>
               <button class="btn" onclick="downloadCurrent('${asset.url}')"><i class="fas fa-download"></i> Bajar</button>
               <button class="btn btn-danger" onclick="moveToTrash('${asset.id}')"><i class="fas fa-trash"></i> Borrar</button>`;

        panel.innerHTML = `
            <div class="panel-header">
                <h3>Detalles</h3>
                <button class="close-panel-btn" onclick="closeInfoPanel()"><i class="fas fa-times"></i></button>
            </div>
            <div class="info-preview">${mediaPreview}</div>
            <div class="info-details">
                <label>Nombre Virtual</label>
                <div>${asset.displayName}</div>
                <label>Ruta Origen</label>
                <div style="font-size:0.7rem; color: var(--neon-primary)">${asset.url}</div>
                <label>Tipo de Archivo</label>
                <div>${asset.ext} Document</div>
                <label>Estado</label>
                <div>${inTrash ? '<span style="color:red">En Papelera</span>' : '<span style="color:green">Activo / Online</span>'}</div>
            </div>
            <div class="info-actions">${actionButtons}</div>
        `;
        panel.classList.add('active');
    }

    function toggleFav(event, id) {
        event.stopPropagation();
        const index = db.favorites.indexOf(id);
        if (index > -1) db.favorites.splice(index, 1);
        else db.favorites.push(id);
        saveDB();
        applyFiltersAndRender();
        showToast(index > -1 ? 'Eliminado de Favoritos' : 'Añadido a Favoritos');
    }

    function moveToTrash(id) {
        db.trash.push(id);
        saveDB();
        closeInfoPanel();
        applyFiltersAndRender();
        updateStats();
        showToast('Enviado a la papelera');
    }

    function restoreFile(id) {
        db.trash = db.trash.filter(t => t !== id);
        saveDB();
        closeInfoPanel();
        applyFiltersAndRender();
        updateStats();
        showToast('Archivo restaurado');
    }

    function permanentlyDelete(id) {
        if(confirm('¿Eliminar permanentemente de la vista?')) {
            db.trash = db.trash.filter(t => t !== id);
            mediaAssets = mediaAssets.filter(a => a.id !== id);
            saveDB();
            closeInfoPanel();
            applyFiltersAndRender();
            updateStats();
            showToast('Destruido de la interfaz');
        }
    }

    function renameFile(id) {
        const asset = mediaAssets.find(a => a.id === id);
        const newName = prompt('Ingrese el nuevo nombre visible:', asset.displayName);
        if (newName && newName.trim() !== '') {
            db.customNames[id] = newName.trim();
            asset.displayName = newName.trim();
            saveDB();
            applyFiltersAndRender();
            selectAsset(id);
            showToast('Renombrado exitoso');
        }
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        showToast('Enlace copiado al portapapeles');
    }

    function updateStats() {
        const activeAssets = mediaAssets.filter(a => !db.trash.includes(a.id));
        document.getElementById('stat-total').innerText = activeAssets.length;
        document.getElementById('stat-img').innerText = activeAssets.filter(a => a.type === 'image').length;
        document.getElementById('stat-vid').innerText = activeAssets.filter(a => a.type === 'video').length;
    }

    // --- JS FALTANTE COMPLETO: LIGHTBOX Y MODALES ---
    function openLightbox(index) {
        currentState.lightboxIndex = index;
        resetTransforms();
        updateLightboxContent();
        document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.getElementById('lb-media-container').innerHTML = ''; 
    }

    function updateLightboxContent() {
        const asset = filteredAssets[currentState.lightboxIndex];
        if (!asset) return;
        
        document.getElementById('lb-title').innerText = asset.displayName;
        const container = document.getElementById('lb-media-container');
        
        if (asset.type === 'video') {
            container.innerHTML = `<video id="lb-media" class="lightbox-media" src="${asset.url}" controls autoplay></video>`;
        } else {
            container.innerHTML = `<img id="lb-media" class="lightbox-media" src="${asset.url}" alt="${asset.displayName}">`;
        }
        applyTransforms();
    }

    function navigateMedia(dir) {
        currentState.lightboxIndex += dir;
        if (currentState.lightboxIndex >= filteredAssets.length) currentState.lightboxIndex = 0;
        if (currentState.lightboxIndex < 0) currentState.lightboxIndex = filteredAssets.length - 1;
        resetTransforms();
        updateLightboxContent();
    }

    function adjustZoom(amount) {
        currentState.lbZoom += amount;
        if (currentState.lbZoom < 0.5) currentState.lbZoom = 0.5;
        if (currentState.lbZoom > 3) currentState.lbZoom = 3;
        applyTransforms();
    }

    function rotateMedia() {
        currentState.lbRotate += 90;
        if (currentState.lbRotate >= 360) currentState.lbRotate = 0;
        applyTransforms();
    }

    function resetTransforms() {
        currentState.lbZoom = 1;
        currentState.lbRotate = 0;
        applyTransforms();
    }

    function applyTransforms() {
        const media = document.getElementById('lb-media');
        if (media) {
            media.style.transform = `scale(${currentState.lbZoom}) rotate(${currentState.lbRotate}deg)`;
        }
    }

    function downloadCurrent(urlOverride) {
        const urlToDownload = urlOverride || filteredAssets[currentState.lightboxIndex]?.url;
        if (!urlToDownload) return;
        
        const a = document.createElement('a');
        a.href = urlToDownload;
        a.download = ''; 
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Descarga iniciada');
    }

    function shareCurrent() {
        const assetUrl = filteredAssets[currentState.lightboxIndex]?.url;
        if (!assetUrl) return;

        if (navigator.share) {
            navigator.share({
                title: 'MaxiQueen OS Media',
                url: assetUrl
            }).catch(console.error);
        } else {
            copyToClipboard(assetUrl);
        }
    }

    function showToast(msg) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-info-circle" style="color: var(--neon-primary)"></i> ${msg}`;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(120%)';
            setTimeout(() => toast.remove(), 400);
        }, 3000);
    }

    // Inicializar al cargar la página
    window.onload = init;
</script>
</body>
</html>
