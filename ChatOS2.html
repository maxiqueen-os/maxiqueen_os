    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

/* =========================================================
⌨️ EFECTO TYPEWRITER
========================================================= */

async function typeWriterEffect(element, text, speed = 14) {

  element.textContent = "";

  let i = 0;

  return new Promise(resolve => {

    function typing() {

      if (i < text.length) {

        element.textContent += text.charAt(i);

        i++;

        scrollToBottom();

        setTimeout(typing, speed);

      } else {

        resolve();
      }
    }

    typing();

  });
}



/* =========================================================
🧠 AGREGAR MENSAJE
========================================================= */

async function appendMessage(
  text,
  sender = "bot",
  animated = true
) {

  const { wrapper, message } =
    createMessageElement(sender);



  /* =====================================================
     👤 MENSAJE USER
  ===================================================== */

  if (sender === "user") {

    message.textContent = text;

  }



  chatLog.appendChild(wrapper);

  scrollToBottom();



  /* =====================================================
     🤖 MENSAJE BOT
  ===================================================== */

  if (sender === "bot") {

    if (animated) {

      await typeWriterEffect(
        message,
        text,
        UI_CONFIG.typingSpeed
      );

    } else {

      message.textContent = text;
    }
  }



  /* =====================================================
     📱 AJUSTE MOBILE
  ===================================================== */

  if (isMobile()) {

    setTimeout(() => {

      scrollToBottom();

    }, 120);
  }
}



/* =========================================================
🤖 INDICADOR DE ESCRITURA
========================================================= */

function showTyping() {

  typingIndicator.classList.remove("hidden");

  scrollToBottom();
}



function hideTyping() {

  typingIndicator.classList.add("hidden");
}



/* =========================================================
🧠 PROCESAR MENSAJE
========================================================= */

async function processMessage(message) {

  try {

    showTyping();



    /* =================================================
       ⏳ DELAY NATURAL
    ================================================= */

    await new Promise(resolve =>
      setTimeout(resolve, UI_CONFIG.botDelay)
    );



    hideTyping();



    const response = getResponse(message);



    await appendMessage(
      response,
      "bot",
      true
    );



  } catch (error) {

    console.error("MaxiQueen UI Error:", error);

    hideTyping();

    appendMessage(
`⚠️ Ocurrió una interrupción temporal en el sistema.

Por favor intenta nuevamente en unos segundos.`,
      "bot",
      false
    );
  }
}

  await processMessage(message);

        "bot",
