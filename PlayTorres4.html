<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MAXIQUEEN OS • SNAKE PROTOCOL V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-purple: #bc13fe;
            --neon-gold: #ffdb58;
            --neon-red: #ff003c;
            --dark-bg: #050a0f;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--dark-bg);
            color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh; 
            overflow: hidden;
        }

        /* HUD MEJORADO */
        #header {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.9);
            border-bottom: 2px solid var(--neon-green);
            flex-shrink: 0;
            transition: border-color 0.3s;
        }

        .stat { text-align: center; }
        .stat-label { font-size: 0.6rem; color: var(--neon-green); display: block; transition: color 0.3s; }
        .stat-value { font-size: 1rem; font-weight: 900; }

        /* BARRA DE VIDA DEL BOSS (Oculta por defecto) */
        #boss-ui {
            display: none;
            width: 100%;
            background: #111;
            padding: 5px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--neon-red);
            font-weight: bold;
            border-bottom: 1px solid var(--neon-red);
            letter-spacing: 2px;
        }

        /* SELECTOR DE AVATARS */
        #avatar-selector {
            display: flex;
            gap: 10px;
            padding: 10px;
            width: 100%;
            overflow-x: auto;
            background: var(--glass);
            flex-shrink: 0;
            scrollbar-width: none; 
        }
        #avatar-selector::-webkit-scrollbar { display: none; }

        .avatar-card {
            min-width: 90px;
            padding: 8px;
            border: 1px solid #333;
            border-radius: 8px;
            text-align: center;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .avatar-card.active {
            border-color: var(--neon-green);
            background: rgba(0, 255, 102, 0.1);
            transform: scale(1.05);
        }

        /* ÁREA DE JUEGO */
        #game-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            min-height: 0;
            position: relative;
        }

        canvas {
            background: #000;
            border: 2px solid #1a1a1a;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            aspect-ratio: 1 / 1;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        /* CONTROLES MÓVILES */
        #controls-container {
            flex-shrink: 0;
            padding: 10px 15px 25px 15px;
            display: flex;
            justify-content: center;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 50px);
            gap: 8px;
            justify-content: center;
        }

        .btn-ctrl {
            background: var(--glass);
            border: 1px solid #333;
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .btn-ctrl:active { background: var(--neon-green); color: black; transform: scale(0.95); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* OVERLAY GAME OVER / START */
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<div id="boss-ui">ALERTA: CORTAFUEGOS ACTIVO - DATOS REQUERIDOS: <span id="boss-hp">5</span></div>

<div id="header">
    <div class="stat"><span class="stat-label">AVATAR</span><span id="current-name" class="stat-value">NEON</span></div>
    <div class="stat"><span class="stat-label">PUNTOS</span><span id="score-val" class="stat-value">0</span></div>
    <div class="stat"><span class="stat-label">NIVEL</span><span id="lv-val" class="stat-value">1</span></div>
</div>

<div id="avatar-selector">
    <div class="avatar-card active" onpointerdown="selectAvatar('NEON', '#00ff66', 110)" id="av-neon">
        <div>🟢</div><strong>NEON</strong><p>Equilibrado</p>
    </div>
    <div class="avatar-card" onpointerdown="selectAvatar('PHANTOM', '#bc13fe', 85)" id="av-phantom">
        <div>🟣</div><strong>PHANTOM</strong><p>Rápido</p>
    </div>
    <div class="avatar-card" onpointerdown="selectAvatar('ROYAL', '#ffdb58', 140)" id="av-royal">
        <div>🟡</div><strong>ROYAL</strong><p>Puntos x2</p>
    </div>
</div>

<div id="game-area">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="overlay">
        <h2 id="overlay-title" style="color: var(--neon-green); margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-green);">MAXIQUEEN OS</h2>
        <button onpointerdown="startGame()" style="padding: 15px 30px; background: var(--glass); color: white; border: 1px solid var(--neon-green); border-radius: 8px; font-family: 'Orbitron'; font-weight: 900; font-size: 1.1rem;">INICIAR PROTOCOLO</button>
    </div>
</div>

<div id="controls-container">
    <div id="controls">
        <div class="btn-ctrl btn-up" onpointerdown="setDir('UP')">▲</div>
        <div class="btn-ctrl btn-left" onpointerdown="setDir('LEFT')">◀</div>
        <div class="btn-ctrl btn-down" onpointerdown="setDir('DOWN')">▼</div>
        <div class="btn-ctrl btn-right" onpointerdown="setDir('RIGHT')">▶</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const TILE_SIZE = 20;
    const TILES_X = canvas.width / TILE_SIZE; 
    const TILES_Y = canvas.height / TILE_SIZE; 
    
    let snake = [];
    let food = {x: 0, y: 0};
    let dir = 'RIGHT';
    let nextDir = 'RIGHT';
    let score = 0;
    let level = 1;
    let gameInterval;
    let currentAvatar = { name: 'NEON', color: '#00ff66', baseSpeed: 110 };
    let voiceEnabled = false;

    // SISTEMA DEL BOSS
    let boss = { active: false, x: 0, y: 0, hp: 5, moveDelay: 0, maxDelay: 2 };

    // SÍNTESIS DE VOZ (MaxiQueen)
    function speak(text, priority = false) {
        if (!('speechSynthesis' in window)) return;
        if (priority) window.speechSynthesis.cancel(); // Interrumpe si es urgente
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES'; // Acento formal/robótico
        utterance.pitch = 0.3; // Tono grave cibernético
        utterance.rate = 1.3; // Velocidad imperativa
        
        // Buscar una voz femenina si está disponible
        const voices = window.speechSynthesis.getVoices();
        const femaleVoice = voices.find(v => v.lang.includes('es') && (v.name.includes('Mujer') || v.name.includes('Female') || v.name.includes('Google español')));
        if(femaleVoice) utterance.voice = femaleVoice;

        window.speechSynthesis.speak(utterance);
    }

    // Inicializar voces al cargar la página (Workaround para Chrome)
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    function selectAvatar(name, color, speed) {
        currentAvatar = { name, color, baseSpeed: speed };
        document.querySelectorAll('.avatar-card').forEach(c => c.classList.remove('active'));
        document.getElementById('av-' + name.toLowerCase()).classList.add('active');
        document.getElementById('current-name').innerText = name;
        document.getElementById('current-name').style.color = color;
    }

    function startGame() {
        voiceEnabled = true;
        speak("Iniciando Protocolo. Evite la aniquilación de sus datos.", true);

        snake = [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}];
        dir = 'RIGHT';
        nextDir = 'RIGHT';
        score = 0;
        level = 1;
        boss.active = false;
        
        resetUIColors();
        updateHUD();
        document.getElementById('overlay').style.display = 'none';
        
        spawnFood();
        
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(update, currentAvatar.baseSpeed);
    }

    function spawnFood() {
        let isSafe = false;
        while(!isSafe) {
            food = {
                x: Math.floor(Math.random() * TILES_X),
                y: Math.floor(Math.random() * TILES_Y)
            };
            isSafe = !snake.some(s => s.x === food.x && s.y === food.y);
            if (boss.active && food.x === boss.x && food.y === boss.y) isSafe = false;
        }
    }

    function triggerBoss() {
        boss.active = true;
        boss.hp = 5;
        boss.x = TILES_X - 2;
        boss.y = TILES_Y - 2;
        
        document.getElementById('boss-ui').style.display = 'block';
        document.getElementById('boss-hp').innerText = boss.hp;
        
        // Efecto visual de Peligro
        document.getElementById('header').style.borderColor = 'var(--neon-red)';
        canvas.style.borderColor = 'var(--neon-red)';
        canvas.style.boxShadow = '0 0 30px rgba(255, 0, 60, 0.4)';
        
        speak("Alerta. Cortafuegos activado. Sobreviva o será eliminado.", true);
    }

    function defeatBoss() {
        boss.active = false;
        score += 200;
        document.getElementById('boss-ui').style.display = 'none';
        resetUIColors();
        speak("Cortafuegos evadido. Desempeño aceptable.", true);
        levelUp();
    }

    function resetUIColors() {
        document.getElementById('header').style.borderColor = 'var(--neon-green)';
        canvas.style.borderColor = '#1a1a1a';
        canvas.style.boxShadow = '0 0 20px rgba(0, 255, 102, 0.15)';
        document.getElementById('boss-ui').style.display = 'none';
    }

    function updateHUD() {
        document.getElementById('score-val').innerText = score;
        document.getElementById('lv-val').innerText = level;
    }

    function levelUp() {
        level++;
        updateHUD();
        
        if (level % 5 === 0) {
            triggerBoss();
        } else {
            speak(`Nivel ${level}. Acelerando procesos.`, false);
        }

        clearInterval(gameInterval);
        const newSpeed = Math.max(45, currentAvatar.baseSpeed - (level * 4));
        gameInterval = setInterval(update, newSpeed);
    }

    function setDir(newDir) {
        const opposites = { 'UP': 'DOWN', 'DOWN': 'UP', 'LEFT': 'RIGHT', 'RIGHT': 'LEFT' };
        if (newDir !== opposites[dir]) nextDir = newDir;
    }

    window.addEventListener('keydown', e => {
        if(['ArrowUp', 'w', 'W'].includes(e.key)) setDir('UP');
        if(['ArrowDown', 's', 'S'].includes(e.key)) setDir('DOWN');
        if(['ArrowLeft', 'a', 'A'].includes(e.key)) setDir('LEFT');
        if(['ArrowRight', 'd', 'D'].includes(e.key)) setDir('RIGHT');
    });

    let touchStartX = 0; let touchStartY = 0;
    document.getElementById('game-area').addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    document.getElementById('game-area').addEventListener('touchend', e => {
        let dx = e.changedTouches[0].screenX - touchStartX;
        let dy = e.changedTouches[0].screenY - touchStartY;
        if(Math.abs(dx) > 30 || Math.abs(dy) > 30) {
            if(Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'RIGHT' : 'LEFT');
            else setDir(dy > 0 ? 'DOWN' : 'UP');
        }
    }, {passive: true});

    function update() {
        dir = nextDir;
        const head = { x: snake[0].x, y: snake[0].y };

        if(dir === 'UP') head.y--;
        if(dir === 'DOWN') head.y++;
        if(dir === 'LEFT') head.x--;
        if(dir === 'RIGHT') head.x++;

        // Colisión Paredes
        if(head.x < 0 || head.x >= TILES_X || head.y < 0 || head.y >= TILES_Y) return gameOver();
        // Colisión Cuerpo
        if(snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

        snake.unshift(head);

        // Lógica de Comida
        if(head.x === food.x && head.y === food.y) {
            score += (currentAvatar.name === 'ROYAL') ? 20 : 10;
            
            if (boss.active) {
                boss.hp--;
                document.getElementById('boss-hp').innerText = boss.hp;
                if (boss.hp <= 0) defeatBoss();
                else spawnFood();
            } else {
                if(score > 0 && (score % 100 === 0 || (currentAvatar.name === 'ROYAL' && score % 200 === 0))) {
                    levelUp();
                }
                spawnFood();
            }
            updateHUD();
        } else {
            snake.pop(); 
        }

        // Inteligencia Artificial del Boss
        if (boss.active) {
            boss.moveDelay++;
            if (boss.moveDelay >= boss.maxDelay) {
                boss.moveDelay = 0;
                // IA Básica de persecución
                if (boss.x < snake[0].x) boss.x++;
                else if (boss.x > snake[0].x) boss.x--;
                else if (boss.y < snake[0].y) boss.y++;
                else if (boss.y > snake[0].y) boss.y--;
            }
            
            // Colisión con el Boss (Muerte instantánea)
            if (snake.some(s => s.x === boss.x && s.y === boss.y)) return gameOver();
        }

        draw();
    }

    function draw() {
        ctx.fillStyle = '#030508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = boss.active ? 'rgba(255, 0, 60, 0.1)' : '#111';
        ctx.lineWidth = 1;
        for(let i=0; i<=canvas.width; i+=TILE_SIZE) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // Dibujar Comida (Datos)
        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0055';
        ctx.fillRect(food.x * TILE_SIZE + 4, food.y * TILE_SIZE + 4, TILE_SIZE - 8, TILE_SIZE - 8);

        // Dibujar Jefe Final
        if (boss.active) {
            ctx.fillStyle = 'var(--neon-red)';
            ctx.shadowBlur = 25;
            ctx.shadowColor = 'var(--neon-red)';
            ctx.fillRect(boss.x * TILE_SIZE, boss.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            // Ojos del jefe
            ctx.fillStyle = 'white';
            ctx.shadowBlur = 0;
            ctx.fillRect(boss.x * TILE_SIZE + 4, boss.y * TILE_SIZE + 4, 4, 4);
            ctx.fillRect(boss.x * TILE_SIZE + 12, boss.y * TILE_SIZE + 4, 4, 4);
        }

        // Dibujar Serpiente
        ctx.shadowColor = currentAvatar.color;
        snake.forEach((s, index) => {
            ctx.fillStyle = index === 0 ? '#ffffff' : currentAvatar.color;
            ctx.shadowBlur = index === 0 ? 20 : 5;
            ctx.globalAlpha = (currentAvatar.name === 'PHANTOM' && index !== 0) ? 0.5 : 1.0;
            ctx.fillRect(s.x * TILE_SIZE + 1, s.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
        });
        
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
    }

    function gameOver() {
        clearInterval(gameInterval);
        document.getElementById('overlay-title').innerText = "SISTEMA CAÍDO";
        document.getElementById('overlay-title').style.color = "var(--neon-purple)";
        document.getElementById('overlay-title').style.textShadow = "0 0 10px var(--neon-purple)";
        document.getElementById('overlay').style.display = 'flex';
        
        speak("Fallo crítico detectado. El protocolo ha sido terminado.", true);
        
        if (typeof navigator.vibrate === "function") navigator.vibrate([200, 100, 200]);
    }
</script>
</body>
</html>
