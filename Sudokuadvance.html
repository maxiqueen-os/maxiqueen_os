<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDOKU MAXIQUEEN PRO - Game Hub 👑</title>
    <style>
        :root {
            /* Paleta de colores futurista */
            --bg-dark: #050505;
            --bg-glow: #0a0a1a;
            --primary: #8b5cf6; /* Morado neón */
            --primary-glow: rgba(139, 92, 246, 0.5);
            --secondary: #1e293b;
            --accent: #00f2ff; /* Cyan neón */
            --accent-glow: rgba(0, 242, 255, 0.4);
            --error: #ff2a5f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 0%, var(--bg-glow), var(--bg-dark) 80%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* --- Utilidad Glassmorphism --- */
        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            z-index: 10;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin: 10px 0 20px 0;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        /* --- Estilos Sudoku --- */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #timer { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
        #lives { color: var(--error); text-shadow: 0 0 10px rgba(255, 42, 95, 0.5); }

        .sudoku-container {
            padding: 10px;
            margin-bottom: 25px;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            background: var(--text-muted);
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 1;
            width: 100%;
        }

        .cell {
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        /* Bordes gruesos para las cuadrículas de 3x3 */
        .cell:nth-child(3n) { border-right: 2px solid var(--accent); }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--accent); }

        /* Estados de la celda */
        .cell:hover { background: rgba(139, 92, 246, 0.3); }
        .cell.fixed { background: #0b0f19; color: var(--text-muted); font-weight: 400; cursor: default; }
        
        /* Efecto Neón para celda seleccionada y relacionadas */
        .cell.selected { 
            background: var(--primary) !important; 
            color: white; 
            box-shadow: inset 0 0 15px rgba(255,255,255,0.5);
        }
        .cell.related { background: rgba(0, 242, 255, 0.15); }
        .cell.same-number { background: rgba(139, 92, 246, 0.4); }
        .cell.error { color: var(--error); animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* --- Controles --- */
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .num-btn {
            padding: 15px 5px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 0 5px var(--accent-glow);
        }

        .num-btn:hover, .num-btn:active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
            transform: translateY(-2px);
        }

        .num-btn.delete { color: var(--error); text-shadow: 0 0 5px rgba(255, 42, 95, 0.5); }
        .num-btn.delete:hover { background: var(--error); color: white; box-shadow: 0 0 15px rgba(255, 42, 95, 0.5); }

        .difficulty-btns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn-sm {
            padding: 10px;
            background: transparent;
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-sm:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        #status-msg {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
            height: 20px;
        }

        /* --- MAXIQUEEN GAME HUB --- */
        .hub-section {
            width: 100%;
            margin-top: 40px;
            padding-bottom: 80px;
        }

        .hub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--primary-glow);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .hub-title {
            color: var(--text-main);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .hub-count {
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .hub-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 450px) {
            .hub-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .hub-card {
            display: flex;
            align-items: center;
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 12px 15px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .hub-card:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px var(--primary-glow);
        }

        .hub-card.empty {
            opacity: 0.5;
            border: 1px dashed var(--text-muted);
            cursor: not-allowed;
            background: transparent;
        }

        .hub-card.empty:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--text-muted);
            background: transparent;
        }

        .card-id {
            font-size: 0.65rem;
            background: rgba(0, 242, 255, 0.1);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            margin-right: 15px;
            border: 1px solid var(--accent-glow);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .card-name {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .card-status {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .card-arrow {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateX(-10px);
        }

        .hub-card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* Chat Trigger */
        .chat-trigger {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), #ec4899);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(236, 72, 153, 0.5);
            transition: transform 0.3s ease;
        }

        .chat-trigger:hover { transform: scale(1.1); }
        .chat-trigger img { width: 65%; height: 65%; object-fit: contain; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>SUDOKU MAXIQUEEN</h1>

    <div class="stats-bar glass">
        <span id="timer">⏱️ 00:00</span>
        <span id="lives">❤️ 3 / 3</span>
    </div>

    <div class="sudoku-container glass">
        <div id="grid" class="sudoku-grid"></div>
    </div>

    <div class="numpad">
        <button class="num-btn" onclick="inputValue(1)">1</button>
        <button class="num-btn" onclick="inputValue(2)">2</button>
        <button class="num-btn" onclick="inputValue(3)">3</button>
        <button class="num-btn" onclick="inputValue(4)">4</button>
        <button class="num-btn" onclick="inputValue(5)">5</button>
        <button class="num-btn" onclick="inputValue(6)">6</button>
        <button class="num-btn" onclick="inputValue(7)">7</button>
        <button class="num-btn" onclick="inputValue(8)">8</button>
        <button class="num-btn" onclick="inputValue(9)">9</button>
        <button class="num-btn delete" onclick="inputValue(0)">⌫</button>
    </div>

    <div class="difficulty-btns">
        <button class="btn-sm" onclick="newGame('easy')">Fácil</button>
        <button class="btn-sm" onclick="newGame('medium')">Medio</button>
        <button class="btn-sm" onclick="newGame('hard')">Difícil</button>
        <button class="btn-sm" onclick="newGame('expert')">Experto</button>
        <button class="btn-sm" onclick="newGame('extreme')">Extremo</button>
        <button class="btn-sm" style="border-color: var(--accent); color: var(--accent);" onclick="solveGame()">Auto-Resolve</button>
    </div>

    <div id="status-msg">Iniciando sistema OS...</div>

    <!-- SECCIÓN DE HUB CON 30 SLOTS -->
    <div class="hub-section">
        <div class="hub-header">
            <span class="hub-title">LIBRERÍA DE JUEGOS OS</span>
            <span class="hub-count">30 SLOTS</span>
        </div>
        
        <div class="hub-grid" id="hubGrid">
            <!-- Dinámico -->
        </div>
    </div>
</div>

<div class="chat-trigger">
    <img src="https://res.cloudinary.com/dxfq3iotg/image/upload/v1626257545/MQ_OS_maxiqueen-avatar_hiywqu.png" alt="Avatar">
</div>

<script>
    const gameList = [
        { id: "MQ-01", name: "Sudoku Pro Edition", status: "Active Module", link: "#" },
        { id: "MQ-02", name: "Fut_MQ_Reflex 5", status: "Advanced Patch", link: "https://juegos-maxi-queen-os.vercel.app/rojo-play3.html" },
        { id: "MQ-03", name: "Play_Senc_Click", status: "Beta Release", link: "https://juegos-maxi-queen-os.vercel.app/click4.html" },
        { id: "MQ-04", name: "Derrumba Torres", status: "Initial Build", link: "https://juegos-maxi-queen-os.vercel.app/play-inicial.html" },
        { id: "MQ-05", name: "Cuadro Niveles", status: "Stable", link: "https://juegos-maxi-queen-os.vercel.app/cuadro-play1.html" },
        { id: "MQ-06", name: "Sudoku Agent MQ 11", status: "Alpha", link: "https://juegos-maxi-queen-os.vercel.app/play11.html" },
    ];

    function renderHub() {
        const hubGrid = document.getElementById('hubGrid');
        hubGrid.innerHTML = '';

        for (let i = 1; i <= 30; i++) {
            const padId = i.toString().padStart(2, '0');
            const game = gameList.find(g => g.id === `MQ-${padId}`);
            
            if (game) {
                hubGrid.innerHTML += `
                    <a href="${game.link}" class="hub-card">
                        <span class="card-id">${game.id}</span>
                        <div class="card-info">
                            <span class="card-name">${game.name}</span>
                            <span class="card-status">${game.status}</span>
                        </div>
                        <div class="card-arrow">→</div>
                    </a>
                `;
            } else {
                hubGrid.innerHTML += `
                    <div class="hub-card empty">
                        <span class="card-id">MQ-${padId}</span>
                        <div class="card-info">
                            <span class="card-name">Empty Slot</span>
                            <span class="card-status">Awaiting deployment...</span>
                        </div>
                    </div>
                `;
            }
        }
    }

    // --- LÓGICA DE INTERFAZ PRO PARA SUDOKU ---
    let selectedCellIndex = null;

    function initGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            // Asignar fila, columna y bloque para la lógica de resaltado
            const row = Math.floor(i / 9);
            const col = i % 9;
            const block = Math.floor(row / 3) * 3 + Math.floor(col / 3);
            
            cell.dataset.index = i;
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.dataset.block = block;

            // Simular algunas celdas fijas aleatorias para diseño
            if (Math.random() > 0.8) {
                cell.classList.add('fixed');
                cell.innerText = Math.floor(Math.random() * 9) + 1;
            }

            cell.onclick = () => selectCell(i);
            grid.appendChild(cell);
        }
    }

    function selectCell(index) {
        const cells = document.querySelectorAll('.cell');
        const targetCell = cells[index];
        
        // Limpiar selecciones previas
        cells.forEach(c => {
            c.classList.remove('selected', 'related', 'same-number');
        });

        if (targetCell.classList.contains('fixed')) {
            selectedCellIndex = null; // No permite editar fijas, pero sí resalta números iguales
        } else {
            selectedCellIndex = index;
            targetCell.classList.add('selected');
        }

        const tRow = targetCell.dataset.row;
        const tCol = targetCell.dataset.col;
        const tBlock = targetCell.dataset.block;
        const tVal = targetCell.innerText;

        cells.forEach(c => {
            // Resaltar cruce y cuadrícula
            if (c.dataset.row === tRow || c.dataset.col === tCol || c.dataset.block === tBlock) {
                if (c !== targetCell) c.classList.add('related');
            }
            // Resaltar números iguales en el tablero
            if (tVal !== "" && c.innerText === tVal && c !== targetCell) {
                c.classList.add('same-number');
            }
        });
    }

    function inputValue(n) {
        if (selectedCellIndex === null) return;
        
        const cell = document.querySelectorAll('.cell')[selectedCellIndex];
        if (cell.classList.contains('fixed')) return;

        cell.innerText = n === 0 ? '' : n;
        
        // Efecto visual al escribir
        cell.style.transform = 'scale(1.1)';
        setTimeout(() => cell.style.transform = 'scale(1)', 150);
        
        // Re-ejecutar selección para actualizar colores si ingresó un número
        selectCell(selectedCellIndex);
    }

    function newGame(lvl) {
        document.getElementById('status-msg').textContent = "Cargando dificultad: " + lvl.toUpperCase() + "...";
        initGrid(); 
        setTimeout(() => { document.getElementById('status-msg').textContent = "Sistema Listo. ¡A jugar!"; }, 800);
    }

    function solveGame() {
        document.getElementById('status-msg').textContent = "Ejecutando algoritmo de resolución...";
    }

    // Inicializar
    renderHub();
    initGrid();
    document.getElementById('status-msg').textContent = "Sistema OS Listo. Selecciona dificultad.";
</script>

</body>
</html>
