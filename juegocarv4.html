<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAXIQUEEN OS - Nivel Evolution Premium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
body,html{width:100%;height:100%;overflow:hidden;background:#000005;font-family:'Inter',system-ui,sans-serif;user-select:none;touch-action:none}
canvas{display:block;position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1;transition: filter 0.3s}
.chromatic-aberration { filter: contrast(1.25) saturate(1.5) drop-shadow(5px 0px 0px rgba(255,0,100,0.6)) drop-shadow(-5px 0px 0px rgba(0,255,255,0.6)); }

.mq-hud{background:radial-gradient(ellipse at center,rgba(2,6,16,.8) 0%,rgba(0,2,8,.95) 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(0,255,200,.15);border-radius:24px;color:#e0f8ff;box-shadow:0 15px 35px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);transform:translateZ(0)}
#ui-top{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(96%,850px);display:grid;grid-template-columns:1fr auto 1fr 1fr;gap:16px;align-items:center;padding:14px 24px;z-index:10}
.mq-metric{font-size:11px;opacity:.85;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.mq-metric span{display:block;color:#00ffc8;font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;text-shadow:0 0 12px rgba(0,255,200,.6);margin-top:2px}
#speedometer{width:85px;height:85px;position:relative}
#speedometer canvas{width:100%;height:100%}
#nitro-bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,0.05)}
#nitro-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff00aa,#ffaa00);transition:width .1s, background 0.3s;box-shadow:0 0 12px #ff00aa}

#sys-stats { position: absolute; top: 125px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 18px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.4); background: rgba(0,0,10,0.6); backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 12px; border: 1px solid rgba(0,255,200,0.1); }
#sys-stats span { color: #00ffc8; font-weight: bold; text-shadow: 0 0 8px rgba(0,255,200,0.3); }

#mq-ai-panel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:min(96%,850px);padding:18px;z-index:10;display:flex;flex-direction:column;gap:14px}
.mq-ai-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mq-router-container{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;flex:1}
.mq-engine-badge{padding:8px 14px;border-radius:12px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:#94a3b8;cursor:pointer;transition:all .25s cubic-bezier(0.4, 0, 0.2, 1)}
.mq-engine-badge.active{background:linear-gradient(135deg,var(--c1,#00ffc8),var(--c2,#008866));color:#000;box-shadow:0 0 20px var(--c1);border:1px solid transparent;transform:translateY(-3px)}
#mq-voice-btn{flex-shrink:0;width:58px;height:58px;border-radius:50%;border:1px solid rgba(244,63,94,.4);background:radial-gradient(circle,#1e1b4b,#4c1d95);color:#f43f5e;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(244,63,94,.3);position:relative;cursor:pointer;transition:.3s}
#mq-voice-btn::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px dashed #f43f5e;opacity:0;transition:opacity.3s;animation:spin 4s linear infinite}
#mq-voice-btn.listening{color:#fff;box-shadow:0 0 30px #f43f5e;border-color:transparent}
#mq-voice-btn.listening::before{opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
#mq-voice-btn:active{transform:scale(.90)}
#mq-log-stream{font-size:12px;color:#a1a1aa;font-family:'JetBrains Mono',monospace;min-height:18px;border-top:1px solid rgba(255,255,255,.05);padding-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mq-log-stream::before{content:'>';color:#00ffc8;font-weight:bold;margin-right:8px}
#mq-log-stream span{color:#fff;font-weight:600}

#game-over-screen{position:absolute;inset:0;background:radial-gradient(circle,rgba(20,0,10,.97),rgba(0,0,0,.99));backdrop-filter:blur(15px);display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;z-index:20;text-align:center;padding:20px;opacity:0;transition:opacity 0.8s}
#game-over-screen h1{font-family:'JetBrains Mono',monospace;font-size:clamp(45px,10vw,80px);background:linear-gradient(135deg,#ff0055,#ff0000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;margin-bottom:12px;letter-spacing:-2px;filter:drop-shadow(0 0 15px rgba(255,0,0,0.4))}
#btn-restart{padding:18px 45px;font-size:16px;font-family:'JetBrains Mono',monospace;font-weight:700;background:linear-gradient(135deg,#00ffc8,#06b6d4);color:#000;border:none;border-radius:14px;box-shadow:0 10px 30px rgba(0,255,200,.4);cursor:pointer;transition:transform .2s, box-shadow .2s}
#btn-restart:hover{box-shadow:0 12px 35px rgba(0,255,200,.6);transform:translateY(-2px)}
#btn-restart:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="ui-top" class="mq-hud">
  <div class="mq-metric">NIVEL <span id="level">1</span></div>
  <div id="speedometer"><canvas id="speedCanvas" width="85" height="85"></canvas></div>
  <div class="mq-metric">SCORE <span id="score">0</span></div>
  <div class="mq-metric">NITRO <span id="nitro-pct">100%</span><div id="nitro-bar"><div id="nitro-fill"></div></div></div>
</div>

<div id="sys-stats">
    FPS: <span id="dom-fps">60</span> | LAT: <span id="dom-lat">12ms</span> | AI: <span id="dom-ai">DRIVE</span>
</div>

<div id="mq-ai-panel" class="mq-hud">
  <div class="mq-ai-row">
    <div class="mq-router-container" id="mq-router">
      <div class="mq-engine-badge active" data-engine="drive" style="--c1:#00ffc8;--c2:#008866">🏎 Drive</div>
      <div class="mq-engine-badge" data-engine="neural" style="--c1:#a800ff;--c2:#5500aa">🧠 Neural</div>
      <div class="mq-engine-badge" data-engine="tactical" style="--c1:#00a8ff;--c2:#0044cc">🎯 Tactical</div>
      <div class="mq-engine-badge" data-engine="quantum" style="--c1:#ff00aa;--c2:#aa0055">⚛ Quantum</div>
      <div class="mq-engine-badge" data-engine="infinity" style="--c1:#e0e7ff;--c2:#6366f1">🌌 Infinity</div>
      <div class="mq-engine-badge" data-engine="hyper" style="--c1:#ef4444;--c2:#f97316">🔥 Hyper</div>
    </div>
    <button id="mq-voice-btn" title="Mantén para hablar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
  </div>
  <div id="mq-log-stream">MaxiQueen OS Engine Init. Di "hipervelocidad", "derecha" o "turbo".</div>
</div>

<div id="game-over-screen">
  <h1>SISTEMA OFFLINE</h1>
  <p style="font-family:'JetBrains Mono';font-size:16px;color:#a1a1aa;margin-bottom:30px">Bioma: <b id="final-level" style="color:#00ffc8">1</b> · Núcleo Kilométrico: <b id="final-score" style="color:#00ffc8">0</b></p>
  <button id="btn-restart">REINICIAR NÚCLEO</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d',{alpha:false, desynchronized:true});
const speedCanvas=document.getElementById('speedCanvas'), sctx=speedCanvas.getContext('2d');
let W=innerWidth, H=innerHeight; canvas.width=W; canvas.height=H;

const LEVELS=[
 {name:'Cúcuta Neón', max:260, color:'#00ffaa', weather:'clear'},
 {name:'Túnel Cuántico', max:290, color:'#9d4edd', weather:'neon'},
 {name:'Andes Eléctricos', max:320, color:'#ffaa00', weather:'fog'},
 {name:'Lluvia Ácida', max:310, color:'#00a8ff', weather:'rain'},
 {name:'Desierto Solar', max:350, color:'#ff6d00', weather:'heat'}
];

const Engines = {
    drive: { mult: 1.0, accel: 1.2, grip: 0.88, color: '#00ffc8', rgb: '0,255,200' },
    neural: { mult: 1.15, accel: 1.5, grip: 0.92, color: '#a800ff', rgb: '168,0,255' },
    tactical: { mult: 0.9, accel: 1.8, grip: 0.75, color: '#00a8ff', rgb: '0,168,255' },
    quantum: { mult: 1.3, accel: 2.2, grip: 0.95, color: '#ff00aa', rgb: '255,0,170' },
    infinity: { mult: 1.5, accel: 2.8, grip: 0.97, color: '#e0e7ff', rgb: '224,231,255' },
    hyper: { mult: 1.8, accel: 3.5, grip: 0.99, color: '#ef4444', rgb: '239,68,68' }
};
let activeEng = 'drive';

const Game={active:true, level:1, score:0, distance:0, speed:0, nitro:100, slowMo:1, screenShake:0, frames:0, lastFps:0, lastTime:0};
const Player={x:0, vx:0, targetX:0, y:H*0.8, w:W*0.12, h:H*0.14, angle:0, trail:[]};
let obstacles=[], particles=[], rain=[], stars=[], city=[];

// Responsive Auto-Scaling
window.addEventListener('resize', ()=>{
    W=innerWidth; H=innerHeight;
    canvas.width=W; canvas.height=H;
    Player.w=W*0.12; Player.h=H*0.14; Player.y=H*0.8;
});

// Audio Sandbox
const AudioX={
    ctx:null, eng:null, gain:null,
    init(){
        if(this.ctx) return;
        this.ctx=new (window.AudioContext||window.webkitAudioContext)();
        this.eng=this.ctx.createOscillator(); this.gain=this.ctx.createGain();
        this.eng.type='sawtooth'; this.eng.frequency.value=40;
        this.gain.gain.value=0.03;
        this.eng.connect(this.gain).connect(this.ctx.destination);
        this.eng.start();
    },
    rpm(s, turbo=false){
        if(!this.ctx || this.ctx.state!=='running') return;
        const f=45+(s/350)*160 + (turbo?60:0);
        this.eng.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.1);
        this.gain.gain.setTargetAtTime(0.02+(s/350)*0.08, this.ctx.currentTime, 0.1);
    },
    boom(){
        if(!this.ctx) return;
        const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.type='square'; o.frequency.setValueAtTime(150,this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(20,this.ctx.currentTime+0.8);
        g.gain.setValueAtTime(0.5,this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.8);
        o.connect(g).connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+0.8);
    },
    beep(){
        if(!this.ctx) this.init();
        const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.frequency.setValueAtTime(600,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(900,this.ctx.currentTime+0.1);
        g.gain.setValueAtTime(0.1,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.1);
        o.connect(g).connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+0.1);
    }
};

// Motor de Voz Ultra Estable
const Voice={
    syn:window.speechSynthesis, rec:null, listen:false,
    speak(txt){
        this.syn.cancel();
        const u=new SpeechSynthesisUtterance(txt);
        u.lang='es-CO'; u.rate=1.2; u.pitch=1.0; u.volume=1;
        this.syn.speak(u);
        document.getElementById('mq-log-stream').innerHTML = `MaxiQueen OS: <span>${txt}</span>`;
    },
    init(){
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR) return;
        this.rec=new SR(); this.rec.continuous=true; this.rec.interimResults=false; this.rec.lang='es-CO';
        this.rec.onresult=e=>{
            const txt = e.results[e.resultIndex][0].transcript.toLowerCase().trim();
            document.getElementById('mq-log-stream').textContent = `CMD Detectado: "${txt}"`;
            
            if(txt.includes('turbo')||txt.includes('boost')||txt.includes('nitro')) activateTurbo();
            if(txt.includes('frena')||txt.includes('stop')) { Game.speed*=0.3; this.speak('Frenado cinético activado'); }
            if(txt.includes('izquierda')) Player.targetX = -0.75;
            if(txt.includes('derecha')) Player.targetX = 0.75;
            if(txt.includes('centro')||txt.includes('recto')) Player.targetX = 0;
            if(txt.includes('hipervelocidad')||txt.includes('hyper')) { changeEngine('hyper'); activateTurbo(); }
            if(txt.includes('reiniciar') && !Game.active) reset();
        };
        this.rec.onerror=()=>{ if(this.listen) try{this.rec.start()}catch(err){} };
        this.rec.onend=()=>{ if(this.listen) try{this.rec.start()}catch(err){} };
    }
};

// Generación Geométrica del Entorno
for(let i=0;i<120;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.45,s:Math.random()*2+0.5});
for(let i=0;i<35;i++) city.push({x:Math.random()*W,y:H*0.32+Math.random()*60,w:Math.random()*4+1,h:Math.random()*50+15,c:`hsl(${190+Math.random()*50},95%,65%)`});

function initRain(){
    rain=[];
    if(LEVELS[Game.level-1].weather==='rain'){
        for(let i=0;i<120;i++) rain.push({x:Math.random()*W,y:Math.random()*H,l:Math.random()*15+6,v:Math.random()*12+12});
    }
}

function spawn(){
    const lane=(Math.floor(Math.random()*3)-1)*0.62;
    obstacles.push({x:lane,z:0.01,w:W*0.08,h:H*0.09,col:`hsl(${Math.random()*360},90%,60%)`,sp:0.014+Math.random()*0.008});
}

function createParticles(x,y,count,color,isExplosion=false){
    for(let i=0;i<count;i++){
        particles.push({
            x, y, 
            vx: (Math.random()-0.5)*(isExplosion?25:10), 
            vy: (Math.random()-0.5)*(isExplosion?25:8)-2, 
            life: 1.0, 
            s: Math.random()*(isExplosion?7:3)+1, 
            c: color
        });
    }
}

function activateTurbo(){
    if(Game.nitro<15) return;
    const lvl = LEVELS[Game.level-1];
    const eng = Engines[activeEng];
    Game.speed = Math.min((lvl.max*eng.mult)+140, Game.speed+90);
    Game.nitro -= 15;
    Game.screenShake = 16;
    AudioX.rpm(Game.speed, true);
    Voice.speak('Inyección Nitro Cuántica');
    if(navigator.vibrate) navigator.vibrate(100);
    canvas.classList.add('chromatic-aberration');
    setTimeout(()=>canvas.classList.remove('chromatic-aberration'), 600);
}

function changeEngine(engine){
    activeEng = engine;
    document.querySelectorAll('.mq-engine-badge').forEach(b=>{b.classList.remove('active'); b.style.cssText='';});
    const b = document.querySelector(`[data-engine="${engine}"]`);
    if(b) b.classList.add('active');
    const elAi = document.getElementById('dom-ai');
    elAi.textContent = engine.toUpperCase();
    elAi.style.color = Engines[engine].color;
    Voice.speak(`Cambiando a motor ${engine}`);
    AudioX.beep();
}

function reset(){
    Game.active=true; Game.score=0; Game.distance=0; Game.speed=0; Game.nitro=100; Game.slowMo=1; Game.screenShake=0;
    Player.x=0; Player.vx=0; Player.targetX=0; Player.trail=[];
    obstacles=[]; particles=[]; 
    document.getElementById('game-over-screen').style.opacity = '0';
    setTimeout(()=>document.getElementById('game-over-screen').style.display='none', 300);
    Voice.speak('Sistemas MaxiQueen reactivados.');
    canvas.classList.remove('chromatic-aberration');
    initRain();
}

function gameOver(){
    Game.active=false; Game.slowMo=0.15; Game.screenShake=25;
    AudioX.boom(); Voice.speak('Colisión estructural. Modulo desconectado.');
    if(navigator.vibrate) navigator.vibrate([150,80,150]);
    canvas.classList.add('chromatic-aberration');
    
    createParticles(W/2+Player.x*W*0.4, Player.y, 120, '#ff0055', true);
    createParticles(W/2+Player.x*W*0.4, Player.y, 80, '#ffaa00', true);
    
    document.getElementById('final-level').textContent=Game.level; 
    document.getElementById('final-score').textContent=Game.score;
    
    setTimeout(()=>{
        const go = document.getElementById('game-over-screen');
        go.style.display='flex';
        setTimeout(()=>go.style.opacity='1', 50);
        Game.slowMo=1;
    }, 1000);
}

// Input Unificado Eficiente
let keys={};
window.addEventListener('keydown',e=>{
    keys[e.key.toLowerCase()]=true; 
    if(e.code==='Space' && Game.active) activateTurbo();
    if(!AudioX.ctx) AudioX.init();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

canvas.addEventListener('touchstart',e=>{ AudioX.init(); Player.targetX=((e.touches[0].clientX/W)-0.5)*1.8; }, {passive:true});
canvas.addEventListener('touchmove',e=>{ Player.targetX=((e.touches[0].clientX/W)-0.5)*1.8; }, {passive:true});
canvas.addEventListener('touchend',()=>Player.targetX*=0.4, {passive:true});

const vBtn = document.getElementById('mq-voice-btn');
const startV = (e)=>{ e.preventDefault(); AudioX.init(); Voice.listen=true; try{Voice.rec&&Voice.rec.start();}catch(err){} vBtn.classList.add('listening'); AudioX.beep(); };
const stopV = (e)=>{ e.preventDefault(); Voice.listen=false; try{Voice.rec&&Voice.rec.stop();}catch(err){} vBtn.classList.remove('listening'); };
vBtn.addEventListener('mousedown', startV); vBtn.addEventListener('mouseup', stopV);
vBtn.addEventListener('touchstart', startV); vBtn.addEventListener('touchend', stopV);

document.getElementById('btn-restart').onclick=reset;
document.getElementById('mq-router').onclick=e=>{
    const b=e.target.closest('.mq-engine-badge');
    if(b) changeEngine(b.dataset.engine);
};

// --- BUCLE DE ACTUALIZACIÓN (FISICA E INERCIA) ---
function update(dt){
    if(!Game.active) return;
    const lvl = LEVELS[Game.level-1];
    const eng = Engines[activeEng];
    const trueMax = lvl.max * eng.mult;

    if(keys['arrowleft']||keys['a']) Player.targetX = Math.max(-0.9, Player.targetX - 0.07);
    if(keys['arrowright']||keys['d']) Player.targetX = Math.min(0.9, Player.targetX + 0.07);
    if(keys['arrowup']||keys['w']) Game.speed = Math.min(trueMax, Game.speed + eng.accel);
    if(keys['arrowdown']||keys['s']) Game.speed = Math.max(0, Game.speed - eng.accel*3);
    if(!keys['arrowleft'] && !keys['arrowright'] && !keys['a'] && !keys['d']) Player.targetX *= 0.90;
    if(!keys['arrowup'] && !keys['w']) Game.speed *= 0.98;

    const dx = Player.targetX - Player.x;
    Player.vx += dx * 0.22;
    Player.vx *= eng.grip;
    Player.x += Player.vx * dt * 60;
    Player.x = Math.max(-0.9, Math.min(0.9, Player.x));
    Player.angle = Player.vx * 0.14;
    
    if(Game.speed > 80) {
        Player.trail.unshift({x: Player.x, a: Player.angle, life: 1.0});
        if(Player.trail.length > 6) Player.trail.pop();
    }
    Player.trail.forEach(t => t.life -= dt * 4);

    Game.distance += Game.speed * dt * 0.14;
    Game.score = Math.floor(Game.distance);
    if(Game.distance > Game.level*1200 && Game.level < LEVELS.length){
        Game.level++; AudioX.beep(); Voice.speak('Salto de Bioma Detectado');
        document.getElementById('level').textContent = Game.level;
        initRain();
    }
    Game.nitro = Math.min(100, Game.nitro + dt*5.5);

    if(Math.random() < 0.016 + Game.speed/11000) spawn();
    for(let i = obstacles.length-1; i>=0; i--){
        const o = obstacles[i];
        o.z += (o.sp + Game.speed/6000) * dt * 60;
        
        if(o.z > 0.80 && o.z < 0.98){
            const px = W/2 + Player.x*W*0.4;
            const ox = W/2 + o.x*W*0.4 * o.z;
            if(Math.abs(px - ox) < (Player.w*0.75 + o.w*o.z)*0.5){
                gameOver(); return;
            }
        }
        if(o.z > 1.3) obstacles.splice(i,1);
    }

    for(let i=particles.length-1; i>=0; i--){
        let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life-=dt*1.6;
        if(p.life<=0) particles.splice(i,1);
    }
    if(lvl.weather==='rain'){
        rain.forEach(r=>{ r.y += r.v + Game.speed*0.06; if(r.y>H){ r.y=-12; r.x=Math.random()*W; } });
    }

    Game.screenShake *= 0.86;
    if(Game.speed > trueMax*0.82) Game.screenShake += (Math.random()-0.5)*(Game.speed/95);

    document.getElementById('score').textContent=Game.score;
    document.getElementById('nitro-pct').textContent=Math.floor(Game.nitro)+'%';
    const nFill = document.getElementById('nitro-fill');
    nFill.style.width=Game.nitro+'%';
    nFill.style.background = Game.nitro > 20 ? `linear-gradient(90deg, #ff00aa, ${eng.color})` : '#444';
    document.getElementById('dom-lat').textContent = Math.floor(9+Math.random()*5) + 'ms';
    drawSpeed(eng, trueMax);
    AudioX.rpm(Game.speed);
}

// --- RENDERIZADO ALTO RENDIMIENTO (CON CACHÉ Y EFECTOS) ---
function draw(){
    const lvl = LEVELS[Game.level-1];
    const eng = Engines[activeEng];
    const horizon = H*0.45;
    
    ctx.fillStyle = `rgba(0,0,5,${Game.slowMo<1 ? 0.75 : (0.35 + Game.speed/2200)})`;
    ctx.fillRect(0,0,W,H);
    
    ctx.save();
    ctx.translate(Game.screenShake, Game.screenShake);

    // Cielo Profundo Estrellado
    ctx.fillStyle = '#010104'; ctx.fillRect(0,0,W,horizon);
    stars.forEach(s=>{
        s.x -= Game.speed * 0.004;
        if(s.x<0) s.x=W;
        ctx.fillStyle = `rgba(255,255,255,${s.s/2.2})`; ctx.fillRect(s.x, s.y, s.s, s.s);
    });

    // Parallax Urbano
    city.forEach(c=>{
        c.x -= Game.speed * 0.012;
        if(c.x<-25) c.x=W+25;
        ctx.fillStyle = c.c; ctx.globalAlpha = 0.25; ctx.fillRect(c.x, c.y, c.w, c.h);
    });
    ctx.globalAlpha = 1.0;

    // Gradiente Base de Carretera Pseudo-3D
    let roadGrad = ctx.createLinearGradient(0, horizon, 0, H);
    roadGrad.addColorStop(0, '#020208'); roadGrad.addColorStop(1, '#090b16');
    ctx.fillStyle = roadGrad;
    ctx.beginPath(); ctx.moveTo(W*0.48, horizon); ctx.lineTo(W*0.52, horizon); ctx.lineTo(W*0.98, H); ctx.lineTo(W*0.02, H); ctx.fill();

    // Red Ciberpunk de Perspectiva (Grid Lines)
    ctx.strokeStyle = `rgba(${eng.rgb}, 0.15)`; ctx.lineWidth = 1;
    for(let i=0; i<=10; i++){
        let ratio = i/10;
        let hy = horizon + (H - horizon) * Math.pow(ratio, 2);
        ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(W, hy); ctx.stroke();
    }

    // Línea Central Vectorial Reactiva
    ctx.strokeStyle = eng.color; ctx.lineWidth = 4; ctx.shadowBlur = (Game.speed>180)?22:8; ctx.shadowColor = eng.color;
    ctx.setLineDash([45, 55]); ctx.lineDashOffset = -Game.distance * 2.5;
    ctx.beginPath(); ctx.moveTo(W*0.5, horizon); ctx.lineTo(W*0.5, H); ctx.stroke();
    ctx.setLineDash([]); ctx.shadowBlur = 0;

    // Bordes Laterales Luminosos
    ctx.strokeStyle = `rgba(${eng.rgb}, 0.4)`; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(W*0.48, horizon); ctx.lineTo(W*0.02, H); ctx.moveTo(W*0.52, horizon); ctx.lineTo(W*0.98, H); ctx.stroke();

    // Obstáculos con Escala Proporcional Z
    obstacles.sort((a,b)=>b.z-a.z).forEach(o=>{
        const sc=o.z, x=W/2+o.x*W*0.4*sc, y=horizon+(H-horizon)*sc, w=o.w*sc, h=o.h*sc;
        ctx.globalAlpha = Math.min(1, Math.max(0, 1.4 - sc));
        
        ctx.shadowBlur = 12*sc; ctx.shadowColor = o.col; ctx.fillStyle = o.col;
        ctx.beginPath(); ctx.roundRect(x-w/2, y-h, w, h*0.7, 4); ctx.fill();
        ctx.shadowBlur=0;
        
        ctx.fillStyle = '#000a16'; ctx.fillRect(x-w*0.35, y-h*0.88, w*0.7, h*0.22);
        ctx.fillStyle = '#fff'; ctx.fillRect(x-w*0.28, y-h*0.2, w*0.12, h*0.08); ctx.fillRect(x+w*0.16, y-h*0.2, w*0.12, h*0.08);
    });
    ctx.globalAlpha = 1.0;

    // Estela Espectral (Ghosting Hyper)
    Player.trail.forEach(t => {
        if(t.life<=0) return;
        ctx.save(); ctx.translate(W/2 + t.x*W*0.4, Player.y); ctx.rotate(t.a);
        ctx.globalAlpha = t.life * 0.25; ctx.fillStyle = eng.color;
        ctx.beginPath(); ctx.roundRect(-Player.w/2, -Player.h*0.72, Player.w, Player.h*0.5, 8); ctx.fill();
        ctx.restore();
    });
    ctx.globalAlpha = 1.0;

    // VEHÍCULO PREMIUM (Canvas Nativo Puro)
    ctx.save();
    ctx.translate(W/2 + Player.x*W*0.4, Player.y);
    ctx.rotate(Player.angle);

    const pw = Player.w, ph = Player.h;

    // Sombra Inferior
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.beginPath(); ctx.ellipse(0, 0, pw*0.58, ph*0.22, 0, 0, Math.PI*2); ctx.fill();
    
    // Neon Underglow Fluido
    ctx.shadowBlur = 25; ctx.shadowColor = eng.color; ctx.fillStyle = `rgba(${eng.rgb}, 0.45)`;
    ctx.beginPath(); ctx.ellipse(0, -ph*0.12, pw*0.48, ph*0.14, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // Neumáticos Deportivos
    ctx.fillStyle = '#070709';
    ctx.beginPath(); ctx.roundRect(-pw*0.54, -ph*0.35, pw*0.18, ph*0.38, 5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(pw*0.36, -ph*0.35, pw*0.18, ph*0.38, 5); ctx.fill();

    // Chasis Aerodinámico
    let bodyGrad = ctx.createLinearGradient(0, -ph, 0, 0);
    bodyGrad.addColorStop(0, eng.color); bodyGrad.addColorStop(1, '#030712');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-pw*0.38, -ph*0.1);
    ctx.quadraticCurveTo(-pw*0.48, -ph*0.68, -pw*0.24, -ph*0.88);
    ctx.lineTo(pw*0.24, -ph*0.88);
    ctx.quadraticCurveTo(pw*0.48, -ph*0.68, pw*0.38, -ph*0.1);
    ctx.closePath(); ctx.fill();

    // Cabina de Cristal Templado
    let glassGrad = ctx.createLinearGradient(0, -ph, 0, -ph*0.5);
    glassGrad.addColorStop(0, '#020617'); glassGrad.addColorStop(1, '#0ea5e9');
    ctx.fillStyle = glassGrad;
    ctx.beginPath(); ctx.roundRect(-pw*0.28, -ph*0.82, pw*0.56, ph*0.32, 4); ctx.fill();

    // Alerón de Estabilización Estilo Ciber
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.roundRect(-pw*0.56, -ph*0.28, pw*1.12, ph*0.08, 3); ctx.fill();

    // Stop-LEDs Traseros Inteligentes
    let braking = keys['arrowdown']||keys['s'];
    ctx.fillStyle = braking ? '#ff003c' : '#b91c1c';
    ctx.shadowBlur = braking ? 20 : 8; ctx.shadowColor = '#ff003c';
    ctx.beginPath(); ctx.roundRect(-pw*0.42, -ph*0.18, pw*0.22, ph*0.06, 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(pw*0.20, -ph*0.18, pw*0.22, ph*0.06, 2); ctx.fill();
    ctx.shadowBlur = 0;

    // Propulsor de Plasma Reactivo (Fijo Bug de Variable)
    const trueMaxSpeed = lvl.max * eng.mult;
    if(Game.speed > trueMaxSpeed * 0.78 || Game.nitro < 95){
        ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 25; ctx.shadowColor = eng.color;
        ctx.beginPath(); ctx.arc(0, -ph*0.1, pw*0.11, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    ctx.restore();

    // Clima Dinámico en Primer Plano
    if(lvl.weather==='rain'){
        ctx.strokeStyle = 'rgba(180,230,255,0.25)'; ctx.lineWidth = 1;
        rain.forEach(r=>{ ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x+Player.vx*1.8, r.y+r.l); ctx.stroke(); });
    }

    particles.forEach(p=>{
        ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    ctx.restore();
}

function drawSpeed(eng, maxSpeed){
    sctx.clearRect(0,0,85,85); sctx.save(); sctx.translate(42.5,42.5);
    sctx.strokeStyle = 'rgba(255,255,255,0.08)'; sctx.lineWidth = 6;
    sctx.beginPath(); sctx.arc(0,0,34,Math.PI*0.75,Math.PI*2.25); sctx.stroke();

    const arcEnd = Math.PI*0.75 + Math.min(Game.speed/maxSpeed, 1) * Math.PI*1.5;
    sctx.strokeStyle = eng.color; sctx.shadowBlur = 14; sctx.shadowColor = eng.color;
    sctx.lineWidth = 6; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(0,0,34,Math.PI*0.75,arcEnd); sctx.stroke();

    sctx.shadowBlur=0; sctx.fillStyle='#fff';
    sctx.font='800 19px JetBrains Mono'; sctx.textAlign='center'; sctx.textBaseline='middle';
    sctx.fillText(Math.floor(Game.speed), 0, -2);
    sctx.font='700 8px Inter'; sctx.fillStyle = eng.color; sctx.fillText('KM/H', 0, 14);
    sctx.restore();
}

function loop(t){
    if(!Game.lastTime) Game.lastTime=t;
    const dt = Math.min((t-Game.lastTime)/1000, 0.033);
    Game.lastTime=t;

    Game.frames++;
    if(t - Game.lastFps >= 1000){
        document.getElementById('dom-fps').textContent = Game.frames;
        Game.frames = 0; Game.lastFps = t;
    }

    update(dt*Game.slowMo);
    draw();
    requestAnimationFrame(loop);
}

// Inicialización de Sistemas
Voice.init(); initRain(); requestAnimationFrame(loop);
Voice.speak('Sistemas MaxiQueen Premium en línea. Piloto listo.');
</script>
