<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAXIQUEEN OS - Nivel Evolution Premium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
body,html{width:100%;height:100%;overflow:hidden;background:#000005;font-family:'Inter',system-ui,sans-serif;user-select:none;touch-action:none}
canvas{display:block;position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1;transition: filter 0.3s}
.chromatic-aberration { filter: contrast(1.2) saturate(1.4) drop-shadow(4px 0px 0px rgba(255,0,0,0.5)) drop-shadow(-4px 0px 0px rgba(0,255,255,0.5)); }

.mq-hud{background:radial-gradient(ellipse at center,rgba(2,6,16,.75)0%,rgba(0,2,8,.9)100%);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(0,255,200,.12);border-radius:20px;color:#e0f8ff;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);transform:translateZ(0)}
#ui-top{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(96%,800px);display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:12px 20px;z-index:10}
.mq-metric{font-size:11px;opacity:.85;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.mq-metric span{display:block;color:#00ffc8;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;text-shadow:0 0 12px rgba(0,255,200,.5);margin-top:2px}
#speedometer{width:80px;height:80px;position:relative}
#speedometer canvas{width:100%;height:100%}
#nitro-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:6px}
#nitro-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff00aa,#ffaa00);transition:width.2s, background 0.3s;box-shadow:0 0 10px #ff00aa}

#sys-stats { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 15px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.5); background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
#sys-stats span { color: #00ffc8; font-weight: bold; }

#mq-ai-panel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:min(96%,850px);padding:16px;z-index:10;display:flex;flex-direction:column;gap:12px}
.mq-ai-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mq-router-container{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;flex:1}
.mq-engine-badge{padding:8px 12px;border-radius:10px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:#94a3b8;cursor:pointer;transition:all.25s ease}
.mq-engine-badge.active{background:linear-gradient(135deg,var(--c1,#00ffc8),var(--c2,#008866));color:#000;box-shadow:0 0 15px var(--c1);border:1px solid transparent;transform:translateY(-2px)}
#mq-voice-btn{flex-shrink:0;width:56px;height:56px;border-radius:50%;border:1px solid rgba(244,63,94,.4);background:radial-gradient(circle,#1e1b4b,#4c1d95);color:#f43f5e;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(244,63,94,.2);position:relative;cursor:pointer;transition:.3s}
#mq-voice-btn::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px dashed #f43f5e;opacity:0;transition:opacity.3s;animation:spin 4s linear infinite}
#mq-voice-btn.listening{color:#fff;box-shadow:0 0 25px #f43f5e;border-color:transparent}
#mq-voice-btn.listening::before{opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
#mq-voice-btn:active{transform:scale(.92)}
#mq-log-stream{font-size:11px;color:#a1a1aa;font-family:'JetBrains Mono',monospace;min-height:16px;border-top:1px solid rgba(255,255,255,.05);padding-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mq-log-stream::before{content:'>';color:#00ffc8;font-weight:bold;margin-right:6px}

#game-over-screen{position:absolute;inset:0;background:radial-gradient(circle,rgba(15,0,5,.95),rgba(0,0,0,.98));backdrop-filter:blur(10px);display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;z-index:20;text-align:center;padding:20px;opacity:0;transition:opacity 1s}
#game-over-screen h1{font-family:'JetBrains Mono',monospace;font-size:clamp(40px,9vw,70px);background:linear-gradient(135deg,#ff0055,#ff0000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;margin-bottom:8px;letter-spacing:-2px}
#btn-restart{padding:16px 40px;font-size:15px;font-family:'JetBrains Mono',monospace;font-weight:700;background:linear-gradient(135deg,#00ffc8,#06b6d4);color:#000;border:none;border-radius:12px;box-shadow:0 8px 25px rgba(0,255,200,.3);cursor:pointer;transition:transform.2s}
#btn-restart:active{transform:scale(.95)}

/* [MAXI+] NUEVO: Estilos para power-ups */
.powerup-glow { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
</style>
</head>
<body>
<div id="ui-top" class="mq-hud">
  <div class="mq-metric">NIVEL <span id="level">1</span></div>
  <div id="speedometer"><canvas id="speedCanvas" width="80" height="80"></canvas></div>
  <div class="mq-metric">SCORE <span id="score">0</span></div>
  <div class="mq-metric">NITRO <span id="nitro-pct">100%</span><div id="nitro-bar"><div id="nitro-fill"></div></div></div>
</div>

<div id="sys-stats">
    FPS: <span id="dom-fps">60</span> | LAT: <span id="dom-lat">12ms</span> | AI: <span id="dom-ai">DRIVE</span> | BEST: <span id="dom-best">0</span>
</div>

<div id="mq-ai-panel" class="mq-hud">
  <div class="mq-ai-row">
    <div class="mq-router-container" id="mq-router">
      <div class="mq-engine-badge active" data-engine="drive" style="--c1:#00ffc8;--c2:#008866">🏎 Drive</div>
      <div class="mq-engine-badge" data-engine="neural" style="--c1:#a800ff;--c2:#5500aa">🧠 Neural</div>
      <div class="mq-engine-badge" data-engine="tactical" style="--c1:#00a8ff;--c2:#0044cc">🎯 Tactical</div>
      <div class="mq-engine-badge" data-engine="quantum" style="--c1:#ff00aa;--c2:#aa0055">⚛ Quantum</div>
      <div class="mq-engine-badge" data-engine="infinity" style="--c1:#e0e7ff;--c2:#6366f1">🌌 Infinity</div>
      <div class="mq-engine-badge" data-engine="hyper" style="--c1:#ef4444;--c2:#f97316">🔥 Hyper</div>
      <!-- [MAXI+] NUEVO MOTOR -->
      <div class="mq-engine-badge" data-engine="ultra" style="--c1:#fde047;--c2:#facc15">⚡ Ultra</div>
    </div>
    <button id="mq-voice-btn" title="Mantén para hablar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
  </div>
  <div id="mq-log-stream">MaxiQueen OS Engine Init. Di "hipervelocidad" o "izquierda". Presiona P para pausar.</div>
</div>

<div id="game-over-screen">
  <h1>SISTEMA OFFLINE</h1>
  <p style="font-family:'JetBrains Mono';font-size:16px;color:#a1a1aa;margin-bottom:10px">Nivel: <b id="final-level" style="color:#00ffc8">1</b> · Puntos: <b id="final-score" style="color:#00ffc8">0</b></p>
  <p style="font-family:'JetBrains Mono';font-size:12px;color:#fde047;margin-bottom:20px">RÉCORD: <b id="final-best">0</b></p>
  <button id="btn-restart">REINICIAR NÚCLEO</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// FASE 1: Limpieza, Optimización de Render y Variables Globales
const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d',{alpha:false, desynchronized:true});
const speedCanvas=document.getElementById('speedCanvas'), sctx=speedCanvas.getContext('2d');
let W=innerWidth, H=innerHeight; canvas.width=W; canvas.height=H;

const LEVELS=[
 {name:'Cúcuta Neón', max:260, color:'#00ffaa', weather:'clear'},
 {name:'Túnel Cuántico', max:290, color:'#9d4edd', weather:'neon'},
 {name:'Andes Eléctricos', max:320, color:'#ffaa00', weather:'fog'},
 {name:'Lluvia Ácida', max:310, color:'#00a8ff', weather:'rain'},
 {name:'Desierto Solar', max:350, color:'#ff6d00', weather:'heat'},
 // [MAXI+] NUEVOS NIVELES 6-10
 {name:'Neón Nocturno', max:380, color:'#ff00ff', weather:'neon'},
 {name:'Tormenta Plasma', max:400, color:'#00ffff', weather:'rain'},
 {name:'Vacío Cuántico', max:420, color:'#ffffff', weather:'clear'},
 {name:'Hiperespacio', max:450, color:'#fde047', weather:'heat'},
 {name:'Infinito', max:500, color:'#ff0055', weather:'neon'}
];

// FASE 4: Preset Modes
const Engines = {
    drive: { mult: 1.0, accel: 1.2, grip: 0.88, color: '#00ffc8', rgb: '0,255,200' },
    neural: { mult: 1.15, accel: 1.5, grip: 0.92, color: '#a800ff', rgb: '168,0,255' },
    tactical: { mult: 0.9, accel: 1.8, grip: 0.75, color: '#00a8ff', rgb: '0,168,255' },
    quantum: { mult: 1.3, accel: 2.2, grip: 0.95, color: '#ff00aa', rgb: '255,0,170' },
    infinity: { mult: 1.5, accel: 2.8, grip: 0.97, color: '#e0e7ff', rgb: '224,231,255' },
    hyper: { mult: 1.8, accel: 3.5, grip: 0.99, color: '#ef4444', rgb: '239,68' },
    // [MAXI+] NUEVO MOTOR ULTRA
    ultra: { mult: 2.2, accel: 4.2, grip: 1.0, color: '#fde047', rgb: '253,224,71' }
};
let activeEng = 'drive';

const Game={active:true, level:1, score:0, distance:0, speed:0, nitro:100, shield:0, autopilot:0, lastTime:0, slowMo:1, screenShake:0, frames:0, lastFps:0, paused:false, bestScore:0};
// [MAXI+] Cargar récord
Game.bestScore = parseInt(localStorage.getItem('mq-best')||'0');
document.getElementById('dom-best').textContent = Game.bestScore;

const Player={x:0, vx:0, targetX:0, y:H*0.8, w:W*0.12, h:H*0.14, angle:0, trail:[]};
let obstacles=[], particles=[], rain=[], stars=[], city=[], powerups=[];

// Audio Seguro (Anti-Fugas)
const AudioX={
    ctx:null, eng:null, gain:null,
    init(){
        if(this.ctx) return;
        this.ctx=new (window.AudioContext||window.webkitAudioContext)();
        this.eng=this.ctx.createOscillator(); this.gain=this.ctx.createGain();
        this.eng.type='sawtooth'; this.eng.frequency.value=40;
        this.gain.gain.value=0.03;
        this.eng.connect(this.gain).connect(this.ctx.destination);
        this.eng.start();
    },
    rpm(s, turbo=false){
        if(!this.ctx || this.ctx.state!=='running') return;
        const f=45+(s/350)*160 + (turbo?50:0);
        this.eng.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.1);
        this.gain.gain.setTargetAtTime(0.02+(s/350)*0.08, this.ctx.currentTime, 0.1);
    },
    boom(){
        if(!this.ctx) return;
        const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.type='square'; o.frequency.setValueAtTime(150,this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(20,this.ctx.currentTime+0.8);
        g.gain.setValueAtTime(0.5,this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.8);
        o.connect(g).connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+0.8);
    },
    beep(){
        if(!this.ctx) this.init();
        const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.frequency.setValueAtTime(600,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(900,this.ctx.currentTime+0.1);
        g.gain.setValueAtTime(0.1,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.1);
        o.connect(g).connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime+0.1);
    }
};

// FASE 5: Voz Optimizada
const Voice={
    syn:window.speechSynthesis, rec:null, listen:false,
    speak(txt){
        this.syn.cancel();
        const u=new SpeechSynthesisUtterance(txt);
        u.lang='es-CO'; u.rate=1.2; u.pitch=1.1; u.volume=1;
        this.syn.speak(u);
        document.getElementById('mq-log-stream').innerHTML = `MaxiQueen: <span>${txt}</span>`;
    },
    init(){
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR) return;
        this.rec=new SR(); this.rec.continuous=true; this.rec.interimResults=false; this.rec.lang='es-CO';
        this.rec.onresult=e=>{
            const txt = e.results[e.resultIndex][0].transcript.toLowerCase().trim();
            document.getElementById('mq-log-stream').textContent = `CMD: "${txt}"`;

            if(txt.includes('turbo')||txt.includes('boost')) activateTurbo();
            if(txt.includes('frena')||txt.includes('stop')) { Game.speed*=0.4; this.speak('Frenado de emergencia'); }
            if(txt.includes('izquierda')) Player.targetX = -0.75;
            if(txt.includes('derecha')) Player.targetX = 0.75;
            if(txt.includes('centro')) Player.targetX = 0;
            if(txt.includes('hipervelocidad')) { changeEngine('hyper'); activateTurbo(true); }
            if(txt.includes('ultra')) { changeEngine('ultra'); activateTurbo(true); } // [MAXI+]
            if(txt.includes('escudo')) { Game.shield=300; this.speak('Escudo activado'); } // [MAXI+]
            if(txt.includes('reiniciar') &&!Game.active) reset();
        };
        this.rec.onend=()=>{ if(this.listen) this.rec.start(); };
    }
};

// Entorno
for(let i=0;i<150;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.45,s:Math.random()*2+0.5});
for(let i=0;i<40;i++) city.push({x:Math.random()*W,y:H*0.35+Math.random()*50,w:Math.random()*3+1,h:Math.random()*40+10,c:`hsl(${190+Math.random()*60},90%,60%)`});

function initRain(){
    rain=[];
    if(LEVELS[Game.level-1].weather==='rain'){
        for(let i=0;i<150;i++) rain.push({x:Math.random()*W,y:Math.random()*H,l:Math.random()*15+5,v:Math.random()*10+10});
    }
}

function spawn(){
    const lane=(Math.floor(Math.random()*3)-1)*0.6;
    obstacles.push({x:lane,z:0,w:W*0.08,h:H*0.09,col:`hsl(${Math.random()*360},85%,55%)`,sp:0.012+Math.random()*0.008});
}

// [MAXI+] NUEVO: Spawn power-ups
function spawnPowerup(){
    if(Math.random()<0.003){
        powerups.push({x:(Math.random()*2-1)*0.7, z:0, type: Math.random()<0.5?'nitro':'shield'});
    }
}

function createParticles(x,y,count,color,isExplosion=false){
    for(let i=0;i<count;i++){
        particles.push({
            x, y,
            vx: (Math.random()-0.5)*(isExplosion?30:12),
            vy: (Math.random()-0.5)*(isExplosion?30:8)-2,
            life: 1,
            s: Math.random()*(isExplosion?8:4)+1,
            c: color
        });
    }
}

function activateTurbo(hyper=false){
    if(Game.nitro<15 &&!hyper) return;
    Game.speed = Math.min(LEVELS[Game.level-1].max*Engines[activeEng].mult + 150, Game.speed+(hyper?150:80));
    Game.nitro -= hyper?0:15;
    Game.screenShake = hyper?25:12;
    AudioX.rpm(Game.speed, true);
    Voice.speak(hyper? 'Hipervelocidad cuántica acoplada' : 'Inyección de nitro');
    if(navigator.vibrate) navigator.vibrate(hyper?150:80);
    canvas.classList.add('chromatic-aberration');
    setTimeout(()=>canvas.classList.remove('chromatic-aberration'), 800);
}

function changeEngine(engine){
    activeEng = engine;
    document.querySelectorAll('.mq-engine-badge').forEach(b=>{b.classList.remove('active'); b.style.cssText='';});
    const b = document.querySelector(`[data-engine="${engine}"]`);
    if(b) b.classList.add('active');
    document.getElementById('dom-ai').textContent = engine.toUpperCase();
    document.getElementById('dom-ai').style.color = Engines[engine].color;
    Voice.speak(`Motor cambiado a ${engine}`);
    AudioX.beep();
}

function reset(){
    // [MAXI+] Guardar récord
    if(Game.score > Game.bestScore){
        Game.bestScore = Game.score;
        localStorage.setItem('mq-best', Game.bestScore);
        document.getElementById('dom-best').textContent = Game.bestScore;
    }
    Game.active=true; Game.score=0; Game.distance=0; Game.speed=0; Game.nitro=100; Game.slowMo=1; Game.screenShake=0; Game.shield=0;
    Player.x=0; Player.vx=0; Player.targetX=0; Player.trail=[];
    obstacles=[]; particles=[]; powerups=[];
    document.getElementById('game-over-screen').style.opacity = '0';
    setTimeout(()=>document.getElementById('game-over-screen').style.display='none', 300);
    Voice.speak('Sistemas restablecidos. Ecosistema en línea.');
    canvas.classList.remove('chromatic-aberration');
    initRain();
}

function gameOver(){
    // [MAXI+] Si tiene escudo, no muere
    if(Game.shield>0){ Game.shield=0; Voice.speak('Escudo absorbió impacto'); return; }

    Game.active=false; Game.slowMo=0.15; Game.screenShake=30;
    AudioX.boom(); Voice.speak('Colisión crítica detectada. Daño estructural.');
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    canvas.classList.add('chromatic-aberration');

    createParticles(W/2+Player.x*W*0.4, Player.y, 150, '#ff0033', true);
    createParticles(W/2+Player.x*W*0.4, Player.y, 100, '#ffaa00', true);

    document.getElementById('final-level').textContent=Game.level;
    document.getElementById('final-score').textContent=Game.score;
    document.getElementById('final-best').textContent=Game.bestScore;

    setTimeout(()=>{
        const go = document.getElementById('game-over-screen');
        go.style.display='flex';
        setTimeout(()=>go.style.opacity='1', 50);
        Game.slowMo=1;
    }, 1200);
}

// Listeners unificados
let keys={};
window.addEventListener('keydown',e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.code==='Space' && Game.active) activateTurbo();
    if(e.key.toLowerCase()==='p'){ Game.paused=!Game.paused; Voice.speak(Game.paused?'Pausa':'Reanudado'); } // [MAXI+]
    if(!AudioX.ctx) AudioX.init();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

canvas.addEventListener('touchstart',e=>{ AudioX.init(); Player.targetX=((e.touches[0].clientX/W)-0.5)*1.8; }, {passive:true});
canvas.addEventListener('touchmove',e=>{ Player.targetX=((e.touches[0].clientX/W)-0.5)*1.8; }, {passive:true});
canvas.addEventListener('touchend',()=>Player.targetX*=0.5, {passive:true});

// [MAXI+] Control por inclinación móvil
window.addEventListener('deviceorientation', e=>{
    if(e.gamma) Player.targetX = Math.max(-0.9, Math.min(0.9, e.gamma/30));
});

const vBtn = document.getElementById('mq-voice-btn');
const startV = (e)=>{ e.preventDefault(); AudioX.init(); Voice.listen=true; try{Voice.rec&&Voice.rec.start();}catch(e){} vBtn.classList.add('listening'); AudioX.beep(); };
const stopV = (e)=>{ e.preventDefault(); Voice.listen=false; Voice.rec&&Voice.rec.stop(); vBtn.classList.remove('listening'); };
vBtn.addEventListener('mousedown', startV); vBtn.addEventListener('mouseup', stopV);
vBtn.addEventListener('touchstart', startV); vBtn.addEventListener('touchend', stopV);

document.getElementById('btn-restart').onclick=reset;
document.getElementById('mq-router').onclick=e=>{
    const b=e.target.closest('.mq-engine-badge');
    if(b) changeEngine(b.dataset.engine);
};

function update(dt){
    if(!Game.active || Game.paused) return; // [MAXI+]
    const lvl = LEVELS[Game.level-1];
    const eng = Engines[activeEng];
    const trueMax = lvl.max * eng.mult;

    if(keys['arrowleft']||keys['a']) Player.targetX = Math.max(-0.9, Player.targetX - 0.08);
    if(keys['arrowright']||keys['d']) Player.targetX = Math.min(0.9, Player.targetX + 0.08);
    if(keys['arrowup']||keys['w']) Game.speed = Math.min(trueMax, Game.speed + eng.accel);
    if(keys['arrowdown']||keys['s']) Game.speed = Math.max(0, Game.speed - eng.accel*3);
    if(!keys['arrowleft'] &&!keys['arrowright'] &&!keys['a'] &&!keys['d']) Player.targetX *= 0.92;
    if(!keys['arrowup'] &&!keys['w']) Game.speed *= 0.97;

    const dx = Player.targetX - Player.x;
    Player.vx += dx * 0.2;
    Player.vx *= eng.grip;
    Player.x += Player.vx * dt * 60;
    Player.x = Math.max(-0.9, Math.min(0.9, Player.x));
    Player.angle = Player.vx * 0.15;

    if(Game.speed > 100) {
        Player.trail.unshift({x: Player.x, a: Player.angle, life: 1});
        if(Player.trail.length > 5) Player.trail.pop();
    }
    Player.trail.forEach(t => t.life -= dt * 5);

    Game.distance += Game.speed * dt * 0.12;
    Game.score = Math.floor(Game.distance);
    if(Game.distance > Game.level*1000 && Game.level < LEVELS.length){
        Game.level++; AudioX.beep(); Voice.speak('Evolución de Bioma '+LEVELS[Game.level-1].name);
        document.getElementById('level').textContent = Game.level;
        initRain();
    }
    Game.nitro = Math.min(100, Game.nitro + dt*6);
    if(Game.shield>0) Game.shield -= dt*60; // [MAXI+]

    if(Math.random() < 0.015 + Game.speed/12000) spawn();
    spawnPowerup(); // [MAXI+]

    for(let i = obstacles.length-1; i>=0; i--){
        const o = obstacles[i];
        o.z += (o.sp + Game.speed/5000) * dt * 60;

        if(o.z > 0.78 && o.z < 0.95){
            const px = W/2 + Player.x*W*0.4;
            const ox = W/2 + o.x*W*0.4 * o.z;
            if(Math.abs(px - ox) < (Player.w*0.8 + o.w*o.z)*0.45){
                gameOver(); return;
            }
        }
        if(o.z > 1.25) obstacles.splice(i,1);
    }

    // [MAXI+] Colisión power-ups
    for(let i=powerups.length-1;i>=0;i--){
        const p=powerups[i]; p.z+=(0.01+Game.speed/5000)*dt*60;
        if(p.z>0.75 && p.z<0.95 && Math.abs(Player.x-p.x)<0.3){
            if(p.type==='nitro'){ Game.nitro=100; Voice.speak('Nitro completo'); }
            else { Game.shield=300; Voice.speak('Escudo activado'); }
            powerups.splice(i,1); createParticles(W/2, H*0.7, 30, '#00ffc8');
        }
        if(p.z>1.3) powerups.splice(i,1);
    }

    for(let i=particles.length-1; i>=0; i--){
        let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.5; p.life-=dt*1.5;
        if(p.life<=0) particles.splice(i,1);
    }
    if(lvl.weather==='rain'){
        rain.forEach(r=>{ r.y += r.v + Game.speed*0.05; if(r.y>H){ r.y=-10; r.x=Math.random()*W; } });
    }

    Game.screenShake *= 0.85;
    if(Game.speed > trueMax*0.8) Game.screenShake += (Math.random()-0.5)*(Game.speed/100);

    document.getElementById('score').textContent=Game.score;
    document.getElementById('nitro-pct').textContent=Math.floor(Game.nitro)+'%';
    const nFill = document.getElementById('nitro-fill');
    nFill.style.width=Game.nitro+'%';
    nFill.style.background = Game.nitro > 20? `linear-gradient(90deg, #ff00aa, ${eng.color})` : '#555';
    document.getElementById('dom-lat').textContent = Math.floor(10+Math.random()*8) + 'ms';
    drawSpeed(eng, trueMax);
    AudioX.rpm(Game.speed);
}

function draw(){
    const lvl = LEVELS[Game.level-1];
    const eng = Engines[activeEng];
    const horizon = H*0.45;

    ctx.fillStyle = `rgba(0, 0, 5, ${Game.slowMo<1? 0.8 : (0.35 + Game.speed/2500)})`;
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(Game.screenShake, Game.screenShake);

    ctx.fillStyle = '#010103'; ctx.fillRect(0,0,W,horizon);
    stars.forEach(s=>{
        s.x -= Game.speed * 0.005;
        if(s.x<0) s.x=W;
        ctx.fillStyle = `rgba(255,255,${s.s/2.5})`; ctx.fillRect(s.x, s.y, s.s, s.s);
    });

    city.forEach(c=>{
        c.x -= Game.speed * 0.015;
        if(c.x<-20) c.x=W+20;
        ctx.fillStyle = c.c; ctx.globalAlpha = 0.3; ctx.fillRect(c.x, c.y, c.w, c.h);
    });
    ctx.globalAlpha = 1;

    let roadGrad = ctx.createLinearGradient(0, horizon, 0, H);
    roadGrad.addColorStop(0, '#020308'); roadGrad.addColorStop(1, '#0a0d18');
    ctx.fillStyle = roadGrad;
    ctx.beginPath(); ctx.moveTo(W*0.48, horizon); ctx.lineTo(W*0.52, horizon); ctx.lineTo(W*0.98, H); ctx.lineTo(W*0.02, H); ctx.fill();

    ctx.strokeStyle = eng.color; ctx.lineWidth = 3; ctx.shadowBlur = (Game.speed>200)?25:10; ctx.shadowColor = eng.color;
    ctx.setLineDash([40, 50]); ctx.lineDashOffset = -Game.distance * 2;
    ctx.beginPath(); ctx.moveTo(W*0.5, horizon); ctx.lineTo(W*0.5, H); ctx.stroke();
    ctx.setLineDash([]); ctx.shadowBlur = 0;

    ctx.strokeStyle = `rgba(${eng.rgb}, 0.3)`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W*0.48, horizon); ctx.lineTo(W*0.02, H); ctx.moveTo(W*0.52, horizon); ctx.lineTo(W*0.98, H); ctx.stroke();

    obstacles.sort((a,b)=>b.z-a.z).forEach(o=>{
        const sc=o.z, x=W/2+o.x*W*0.4*sc, y=horizon+(H-horizon)*sc, w=o.w*sc, h=o.h*sc;
        ctx.globalAlpha = Math.max(0, 1 - Math.pow(sc*0.6, 2));

        ctx.shadowBlur = 15*sc; ctx.shadowColor = o.col; ctx.fillStyle = o.col;
        ctx.beginPath(); ctx.roundRect(x-w/2, y-h, w, h*0.7, 3); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle = '#000812'; ctx.fillRect(x-w*0.35, y-h*0.9, w*0.7, h*0.25);
        ctx.fillStyle = '#fff'; ctx.fillRect(x-w*0.3, y-h*0.2, w*0.15, h*0.1); ctx.fillRect(x+w*0.15, y-h*0.2, w*0.15, h*0.1);
    });
    ctx.globalAlpha = 1;

    // [MAXI+] Dibujar power-ups
    powerups.forEach(p=>{
        const sc=p.z, x=W/2+p.x*W*0.4*sc, y=horizon+(H-horizon)*sc;
        ctx.fillStyle = p.type==='nitro'?'#ff00aa':'#00ffc8';
        ctx.shadowBlur=20; ctx.shadowColor=ctx.fillStyle;
        ctx.beginPath(); ctx.arc(x,y,12*sc,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle='#000'; ctx.font='bold '+10*sc+'px Arial'; ctx.textAlign='center';
        ctx.fillText(p.type==='nitro'?'N':'S', x, y+3*sc);
    });

    Player.trail.forEach(t => {
        if(t.life<=0) return;
        ctx.save(); ctx.translate(W/2 + t.x*W*0.4, Player.y); ctx.rotate(t.a);
        ctx.globalAlpha = t.life * 0.3;
        ctx.fillStyle = eng.color;
        ctx.beginPath(); ctx.roundRect(-Player.w/2, -Player.h*0.7, Player.w, Player.h*0.5, 8); ctx.fill();
        ctx.restore();
    });
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(W/2 + Player.x*W*0.4, Player.y);
    ctx.rotate(Player.angle);

    const pw = Player.w, ph = Player.h;

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.ellipse(0, 0, pw*0.6, ph*0.25, 0, 0, Math.PI*2); ctx.fill();

    // [MAXI+] Escudo visual
    if(Game.shield>0){
        ctx.strokeStyle=`rgba(0,255,200,${Game.shield/300})`; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(0,-ph*0.4,pw*0.7,0,Math.PI*2); ctx.stroke();
    }

    ctx.shadowBlur = 30; ctx.shadowColor = eng.color; ctx.fillStyle = `rgba(${eng.rgb}, 0.5)`;
    ctx.beginPath(); ctx.ellipse(0, -ph*0.1, pw*0.5, ph*0.15, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#050505';
    ctx.beginPath(); ctx.roundRect(-pw*0.55, -ph*0.35, pw*0.2, ph*0.4, 6); ctx.fill();
    ctx.beginPath(); ctx.roundRect(pw*0.35, -ph*0.35, pw*0.2, ph*0.4, 6); ctx.fill();
    ctx.fillStyle = '#475569';
    ctx.fillRect(-pw*0.48, -ph*0.25, pw*0.06, ph*0.2); ctx.fillRect(pw*0.42, -ph*0.25, pw*0.06, ph*0.2);

    let bodyGrad = ctx.createLinearGradient(0, -ph, 0, 0);
    bodyGrad.addColorStop(0, eng.color); bodyGrad.addColorStop(1, '#020617');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-pw*0.4, -ph*0.1);
    ctx.quadraticCurveTo(-pw*0.5, -ph*0.7, -pw*0.25, -ph*0.9);
    ctx.lineTo(pw*0.25, -ph*0.9);
    ctx.quadraticCurveTo(pw*0.5, -ph*0.7, pw*0.4, -ph*0.1);
    ctx.closePath();
    ctx.fill();

    let glassGrad = ctx.createLinearGradient(0, -ph, 0, -ph*0.5);
    glassGrad.addColorStop(0, '#0f172a'); glassGrad.addColorStop(1, '#38bdf8');
    ctx.fillStyle = glassGrad;
    ctx.beginPath(); ctx.roundRect(-pw*0.3, -ph*0.85, pw*0.6, ph*0.35, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath(); ctx.moveTo(-pw*0.2, -ph*0.8); ctx.lineTo(pw*0.1, -ph*0.8); ctx.lineTo(pw*0.2, -ph*0.6); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.roundRect(-pw*0.55, -ph*0.3, pw*1.1, ph*0.1, 4); ctx.fill();
    ctx.fillStyle = '#020617'; ctx.fillRect(-pw*0.3, -ph*0.4, pw*0.05, ph*0.15); ctx.fillRect(pw*0.25, -ph*0.4, pw*0.05, ph*0.15);

    let braking = keys['arrowdown']||keys['s'];
    ctx.fillStyle = braking? '#ff0033' : '#990011';
    ctx.shadowBlur = braking? 25 : 10; ctx.shadowColor = '#ff0033';
    ctx.beginPath(); ctx.roundRect(-pw*0.45, -ph*0.2, pw*0.25, ph*0.07, 3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(pw*0.2, -ph*0.2, pw*0.25, ph*0.07, 3); ctx.fill();
    ctx.shadowBlur = 0;

    if(Game.speed > 200 || Game.isTurbo){
        ctx.fillStyle = '#fff'; ctx.shadowBlur = 20; ctx.shadowColor = eng.color;
        ctx.beginPath(); ctx.arc(0, -ph*0.1, pw*0.12, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    ctx.restore();

    if(lvl.weather==='rain'){
        ctx.strokeStyle = 'rgba(150,220,255,0.3)'; ctx.lineWidth = 1;
        rain.forEach(r=>{ ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x+Player.vx*2, r.y+r.l); ctx.stroke(); });
    }

    particles.forEach(p=>{
        ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    ctx.restore();

    // [MAXI+] Pausa overlay
    if(Game.paused){
        ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#00ffc8'; ctx.font='bold 48px JetBrains Mono'; ctx.textAlign='center';
        ctx.fillText('PAUSA', W/2, H/2);
    }
}

function drawSpeed(eng, maxSpeed){
    sctx.clearRect(0,0,80); sctx.save(); sctx.translate(40,40);
    sctx.strokeStyle = 'rgba(255,255,255,0.1)'; sctx.lineWidth = 6;
    sctx.beginPath(); sctx.arc(0,0,32,Math.PI*0.75,Math.PI*2.25); sctx.stroke();

    const a = Math.PI*0.75 + Math.min(Game.speed/maxSpeed, 1) * Math.PI*1.5;
    sctx.strokeStyle = eng.color; sctx.shadowBlur = 12; sctx.shadowColor = eng.color;
    sctx.lineWidth = 6; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(0,0,32,Math.PI*0.75,a); sctx.stroke();

    sctx.shadowBlur=0; sctx.fillStyle='#fff';
    sctx.font='800 18px JetBrains Mono'; sctx.textAlign='center'; sctx.textBaseline='middle';
    sctx.fillText(Math.floor(Game.speed), 0, -2);
    sctx.font='700 8px Inter'; sctx.fillStyle = eng.color; sctx.fillText('KM/H', 0, 14);
    sctx.restore();
}

function loop(t){
    if(!Game.lastTime) Game.lastTime=t;
    const dt = Math.min((t-Game.lastTime)/1000, 0.033);
    Game.lastTime=t;

    Game.frames++;
    if(t - Game.lastFps >= 1000){
        document.getElementById('dom-fps').textContent = Game.frames;
        Game.frames = 0; Game.lastFps = t;
    }

    update(dt*Game.slowMo);
    draw();
    requestAnimationFrame(loop);
}

Voice.init(); initRain(); requestAnimationFrame(loop);
Voice.speak('Sistemas evolucionados. 10 niveles activos. Motor Ultra desbloqueado. Piloto, inserte comando de voz.');
</script>
