<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAXIQUEEN OS • OMNI-DIRECTIONAL 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #7000ff;
            --neon-red: #ff0055;
            --neon-green: #39ff14;
            --dark-core: #010308;
            --glass-bg: rgba(1, 3, 8, 0.7);
            --glass-border: rgba(0, 242, 255, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { 
            background: var(--dark-core); 
            color: white; 
            font-family: 'Orbitron', sans-serif;
            height: 100vh; 
            overflow: hidden;
            display: flex; 
            flex-direction: column;
        }

        /* OVERLAYS & MENUS */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 3, 8, 0.9);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.5s ease;
        }
        .hidden { opacity: 0; pointer-events: none; }

        .title-glitch {
            font-size: 2.5rem; color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-purple);
            text-align: center; margin-bottom: 5px; font-weight: 900;
        }
        
        .btn-cyber {
            margin-top: 30px; padding: 15px 40px;
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green); font-weight: 900; font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2) inset;
            transition: all 0.3s ease;
        }
        .btn-cyber:hover, .btn-cyber:active {
            background: var(--neon-green); color: black;
            box-shadow: 0 0 30px var(--neon-green);
        }

        /* HUD - INTERFAZ CRISTAL */
        #hud {
            display: grid; grid-template-columns: repeat(3, 1fr);
            background: var(--glass-bg); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 10px; z-index: 100;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }
        .stat-group { text-align: center; }
        .label { font-size: 0.6rem; color: rgba(255,255,255,0.5); display: block; letter-spacing: 2px; }
        .value { font-size: 1.2rem; font-family: 'JetBrains Mono', monospace; font-weight: bold; text-shadow: 0 0 5px currentColor; }
        
        #hp-val { color: var(--neon-green); }
        #coin-val { color: var(--neon-blue); }
        #sh-val { color: var(--neon-purple); }

        #game-container { flex-grow: 1; position: relative; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }

        /* CONTROLES MÓVILES */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 130px; height: 130px; 
            background: rgba(0, 242, 255, 0.05);
            border-radius: 50%; border: 1px dashed var(--glass-border);
            z-index: 200; touch-action: none;
            backdrop-filter: blur(4px);
        }
        #joystick-stick {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px; background: rgba(0, 242, 255, 0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--neon-blue);
            transition: background 0.2s;
        }

        /* PANEL DE ACCIONES */
        #action-panel {
            position: absolute; bottom: 30px; right: 30px;
            display: flex; gap: 15px; z-index: 200;
        }
        .action-btn {
            width: 65px; height: 65px; border-radius: 50%;
            background: var(--glass-bg); backdrop-filter: blur(5px);
            color: white; font-size: 0.6rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center; text-align: center;
            cursor: pointer; font-family: 'Orbitron', sans-serif; transition: all 0.2s;
        }
        #btn-shield { border: 2px solid var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple) inset; }
        #btn-shield.active { background: var(--neon-purple); color: white; box-shadow: 0 0 20px var(--neon-purple); }
        
        #btn-repair { border: 2px solid var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue) inset; }
        #btn-repair:active { background: var(--neon-blue); color: black; }

        /* MENSAJE DE NIVEL */
        #central-msg {
            position: absolute; top: 30%; width: 100%; text-align: center;
            font-size: 2rem; color: white; text-shadow: 0 0 20px var(--neon-blue);
            pointer-events: none; opacity: 0; transition: opacity 0.5s, transform 0.5s; 
            transform: scale(0.8); z-index: 500; font-weight: 900;
        }
        #central-msg.show { opacity: 1; transform: scale(1); }

        /* Media queries para PC (Ocultar botones táctiles si no es necesario, opcional) */
        @media (min-width: 1024px) {
            #joystick-zone { display: none; }
            .action-btn { width: 80px; height: 80px; font-size: 0.8rem; }
            #central-msg { font-size: 4rem; }
        }
    </style>
</head>
<body>

<div id="menu-screen" class="overlay">
    <div class="title-glitch">MAXIQUEEN OS</div>
    <div style="color: var(--neon-purple); font-size: 1rem; letter-spacing: 5px;">OMNI-DIRECTIONAL</div>
    <p style="margin-top: 20px; font-size: 0.7rem; color: rgba(255,255,255,0.5); text-align: center; max-width: 300px;">
        PILOTA LA RED NEURAL. DEFIENDE EL SISTEMA.<br>CONTROLES: WASD, FLECHAS O JOYSTICK.
    </p>
    <button class="btn-cyber" onclick="initGameSystem()">INICIAR ENLACE</button>
</div>

<div id="death-screen" class="overlay hidden">
    <div class="title-glitch" style="color: var(--neon-red); text-shadow: 0 0 20px var(--neon-red);">SISTEMA COMPROMETIDO</div>
    <div id="final-score" style="margin-top: 10px; font-size: 1.5rem; color: white;"></div>
    <button class="btn-cyber" style="border-color: var(--neon-red); color: var(--neon-red);" onclick="location.reload()">RESETEAR MATRIZ</button>
</div>

<div id="central-msg">SISTEMA INICIADO</div>

<div id="hud">
    <div class="stat-group"><span class="label">INTEGRIDAD</span><span id="hp-val" class="value">100%</span></div>
    <div class="stat-group"><span class="label">CRÉDITOS</span><span id="coin-val" class="value">000</span></div>
    <div class="stat-group"><span class="label">ESCUDO MQ</span><span id="sh-val" class="value">LISTO</span></div>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>

    <div id="action-panel">
        <div class="action-btn" id="btn-shield" onclick="activateShield()">DEFENSA<br>20 CR</div>
        <div class="action-btn" id="btn-repair" onclick="repair()">REPARAR<br>50 CR</div>
    </div>
</div>

<script>
    /* ==========================================================================
       1. SISTEMA DE AUDIO SINTÉTICO (Sin archivos externos, 100% Código)
       ========================================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const synthVoice = window.speechSynthesis;

    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        
        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gainNode.gain.setValueAtTime(0.05, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(10, now + 0.2);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.linearRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'shield') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.5);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    function speakRobotic(text) {
        if (!synthVoice) return;
        synthVoice.cancel(); // Detener audios previos
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.pitch = 0.2; // Tono grave y robótico
        utterance.rate = 1.2;  // Velocidad ligeramente rápida
        utterance.volume = 0.8;
        
        // Intentar usar una voz de Google si está disponible (suenan más a IA)
        const voices = synthVoice.getVoices();
        const googleVoice = voices.find(v => v.name.includes('Google español') || v.name.includes('Microsoft Sabina'));
        if(googleVoice) utterance.voice = googleVoice;

        synthVoice.speak(utterance);
    }

    // Inicializar voces (necesario en algunos navegadores)
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => synthVoice.getVoices();
    }

    /* ==========================================================================
       2. MOTOR DEL JUEGO
       ========================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const stick = document.getElementById('joystick-stick');
    const joystickZone = document.getElementById('joystick-zone');

    let gameState = 'menu';
    let stats = { hp: 100, coins: 0, level: 1, score: 0, shield: false, shieldCooldown: false };

    let player = { x: 100, y: 0, vx: 0, vy: 0, speed: 6, color: '#00f2ff' };
    let enemies = [];
    let bullets = [];
    let particles = [];
    let keys = {};
    let frameCount = 0;

    // Control Joystick
    let joystickActive = false;
    let joystickData = { x: 0, y: 0 };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = document.getElementById('game-container').offsetHeight;
        if(gameState === 'menu') player.y = canvas.height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Controles PC
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Controles Móvil
    joystickZone.addEventListener('touchstart', e => { joystickActive = true; stick.style.background = '#fff'; e.preventDefault(); }, {passive: false});
    window.addEventListener('touchmove', e => {
        if (!joystickActive) return;
        const touch = e.touches[0];
        const rect = joystickZone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        const maxDist = rect.width / 2;
        const distance = Math.min(maxDist, Math.sqrt(dx*dx + dy*dy));
        const angle = Math.atan2(dy, dx);

        joystickData.x = (Math.cos(angle) * distance) / maxDist;
        joystickData.y = (Math.sin(angle) * distance) / maxDist;

        stick.style.transform = `translate(calc(-50% + ${Math.cos(angle)*distance}px), calc(-50% + ${Math.sin(angle)*distance}px))`;
    }, {passive: false});
    window.addEventListener('touchend', () => {
        joystickActive = false;
        joystickData = { x: 0, y: 0 };
        stick.style.transform = 'translate(-50%, -50%)';
        stick.style.background = 'rgba(0, 242, 255, 0.8)';
    });

    /* ==========================================================================
       3. LÓGICA DE JUEGO (Acciones, Enemigos, UI)
       ========================================================================== */
    function initGameSystem() {
        // Inicializar Audio Context con interacción del usuario
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        document.getElementById('menu-screen').classList.add('hidden');
        speakRobotic("Enlace neuronal establecido. Defiende el sistema operativo MaxiQueen.");
        showCentralMessage("SISTEMA EN LÍNEA", "var(--neon-blue)");
        gameState = 'playing';
        spawnEnemy();
        shootLoop();
        loop();
    }

    function activateShield() {
        if (!stats.shieldCooldown && stats.coins >= 20 && !stats.shield) {
            stats.coins -= 20;
            stats.shield = true;
            stats.shieldCooldown = true;
            playSound('shield');
            speakRobotic("Escudo protector activado.");
            
            document.getElementById('btn-shield').classList.add('active');
            document.getElementById('sh-val').innerText = "ACTIVO";
            document.getElementById('sh-val').style.color = "var(--neon-green)";

            // Duración del escudo
            setTimeout(() => {
                stats.shield = false;
                document.getElementById('btn-shield').classList.remove('active');
                document.getElementById('sh-val').innerText = "RECARGANDO";
                document.getElementById('sh-val').style.color = "var(--neon-red)";
                speakRobotic("Escudo agotado.");
            }, 4000);

            // Cooldown del escudo
            setTimeout(() => {
                stats.shieldCooldown = false;
                document.getElementById('sh-val').innerText = "LISTO";
                document.getElementById('sh-val').style.color = "var(--neon-purple)";
                updateUI();
            }, 10000);
            updateUI();
        } else if (stats.coins < 20) {
            showCentralMessage("CRÉDITOS INSUFICIENTES", "var(--neon-red)");
        }
    }

    function repair() {
        if (stats.coins >= 50 && stats.hp < 100) {
            stats.coins -= 50;
            stats.hp = Math.min(100, stats.hp + 40);
            speakRobotic("Sistemas reparados.");
            playSound('shield'); // Reutilizamos sonido
            updateUI();
        } else if (stats.hp >= 100) {
            showCentralMessage("INTEGRIDAD AL MÁXIMO", "var(--neon-blue)");
        } else {
            showCentralMessage("CRÉDITOS INSUFICIENTES", "var(--neon-red)");
        }
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1, color: color
            });
        }
    }

    function spawnEnemy() {
        if (gameState !== 'playing') return;
        enemies.push({
            x: canvas.width + 50,
            y: Math.random() * (canvas.height - 60) + 30,
            hp: 1 + Math.floor(stats.level / 2),
            speed: (3 + Math.random() * 3) + (stats.level * 0.3),
            size: 25 + Math.random() * 15,
            wobble: Math.random() * Math.PI * 2 // Para que floten un poco en Y
        });
        
        let spawnRate = Math.max(500, 1500 - (stats.level * 100));
        setTimeout(spawnEnemy, spawnRate);
    }

    function shootLoop() {
        if (gameState === 'playing') {
            bullets.push({ x: player.x + 35, y: player.y + 12, vx: 15 });
            playSound('shoot');
        }
        setTimeout(shootLoop, Math.max(150, 400 - (stats.level * 20))); // Dispara más rápido al subir nivel
    }

    function updateUI() {
        const hpEl = document.getElementById('hp-val');
        hpEl.innerText = `${stats.hp}%`;
        
        if(stats.hp > 60) hpEl.style.color = 'var(--neon-green)';
        else if (stats.hp > 30) hpEl.style.color = 'var(--neon-blue)';
        else hpEl.style.color = 'var(--neon-red)';

        document.getElementById('coin-val').innerText = stats.coins.toString().padStart(3, '0');
    }

    function showCentralMessage(text, color) {
        const msg = document.getElementById('central-msg');
        msg.innerText = text;
        msg.style.color = color;
        msg.style.textShadow = `0 0 20px ${color}`;
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 2000);
    }

    /* ==========================================================================
       4. LOOP PRINCIPAL DE RENDERIZADO
       ========================================================================== */
    function loop() {
        if (gameState === 'playing') {
            frameCount++;
            
            // Fondo con rastro (Efecto Motion Blur)
            ctx.fillStyle = 'rgba(1, 3, 8, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Rejilla Cyberpunk en movimiento
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.05)';
            ctx.lineWidth = 1;
            const offset = (frameCount * 2) % 50;
            for(let i = -offset; i < canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let i = 0; i < canvas.height; i+=50) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            // Lógica Movimiento
            let moveX = 0, moveY = 0;
            if (keys['KeyW'] || keys['ArrowUp']) moveY = -1;
            if (keys['KeyS'] || keys['ArrowDown']) moveY = 1;
            if (keys['KeyA'] || keys['ArrowLeft']) moveX = -1;
            if (keys['KeyD'] || keys['ArrowRight']) moveX = 1;

            if (joystickActive) { moveX = joystickData.x; moveY = joystickData.y; }

            player.x += moveX * player.speed;
            player.y += moveY * player.speed;

            // Límites físicos de pantalla
            player.x = Math.max(10, Math.min(canvas.width - 50, player.x));
            player.y = Math.max(10, Math.min(canvas.height - 40, player.y));

            // Dibujar Partículas (Explosiones)
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                if(p.life <= 0) { particles.splice(i,1); return; }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1;
            });

            // Dibujar Escudo de Nave
            if (stats.shield) {
                ctx.beginPath();
                ctx.arc(player.x + 20, player.y + 15, 45, 0, Math.PI*2);
                ctx.strokeStyle = '#7000ff';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = 'rgba(112, 0, 255, 0.15)';
                ctx.fill();
            }

               // Dibujar Nave (Triángulo Sci-Fi)
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 20; ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x + 40, player.y + 15); // Punta
            ctx.lineTo(player.x, player.y); // Arriba Izq
            ctx.lineTo(player.x + 10, player.y + 15); // Centro trasero
            ctx.lineTo(player.x, player.y + 30); // Abajo Izq
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0; // Reset sombra para rendimiento

            // Propulsor de la nave
            ctx.fillStyle = 'rgba(255, 165, 0, ' + (Math.random() * 0.5 + 0.5) + ')';
            ctx.fillRect(player.x - 15, player.y + 12, 20 + Math.random()*10, 6);

            // Dibujar Balas
            bullets.forEach((b, i) => {
                b.x += b.vx;
                ctx.fillStyle = '#00f2ff';
                ctx.shadowBlur = 10; ctx.shadowColor = '#00f2ff';
                ctx.fillRect(b.x, b.y, 25, 3);
                ctx.shadowBlur = 0;
                if (b.x > canvas.width) bullets.splice(i, 1);
            });

            // Lógica Enemigos (Virus Rojos)
            enemies.forEach((en, i) => {
                en.x -= en.speed;
                en.y += Math.sin(en.wobble + frameCount * 0.05) * 2; // Movimiento orgánico
                
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10; ctx.shadowColor = '#ff0055';
                
                // Forma del enemigo (Rombo)
                ctx.beginPath();
                ctx.moveTo(en.x + en.size/2, en.y);
                ctx.lineTo(en.x + en.size, en.y + en.size/2);
                ctx.lineTo(en.x + en.size/2, en.y + en.size);
                ctx.lineTo(en.x, en.y + en.size/2);
                ctx.closePath();
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Colisión Bala-Enemigo
                bullets.forEach((b, bi) => {
                    if (b.x > en.x && b.x < en.x + en.size && b.y > en.y && b.y < en.y + en.size) {
                        en.hp--;
                        bullets.splice(bi, 1);
                        createExplosion(b.x, b.y, '#00f2ff');
                        
                        if (en.hp <= 0) {
                            createExplosion(en.x + en.size/2, en.y + en.size/2, '#ff0055');
                            playSound('hit');
                            enemies.splice(i, 1);
                            stats.coins += 5;
                            stats.score++;
                            
                            // Nivel UP
                            if (stats.score > 0 && stats.score % 20 === 0) { 
                                stats.level++; 
                                speakRobotic(`Sistema evolucionado. Nivel ${stats.level}.`);
                                showCentralMessage(`NIVEL ${stats.level}`, "var(--neon-green)");
                            }
                            updateUI();
                        }
                    }
                });

                // Colisión Jugador-Enemigo
                let dist = Math.hypot((player.x + 20) - (en.x + en.size/2), (player.y + 15) - (en.y + en.size/2));
                if (dist < (en.size/2 + 15)) {
                    createExplosion(en.x, en.y, '#ff0055');
                    enemies.splice(i, 1);
                    playSound('hit');
                    
                    if (!stats.shield) {
                        stats.hp -= 25; // Daño
                        if(stats.hp === 25) speakRobotic("Peligro. Integridad estructural crítica.");
                        updateUI();
                        
                        // Efecto daño visual
                        ctx.fillStyle = 'rgba(255,0,0,0.3)';
                        ctx.fillRect(0,0, canvas.width, canvas.height);

                        if (stats.hp <= 0) {
                            gameState = 'dead';
                            speakRobotic("Falla catastrófica. Datos corruptos.");
                            document.getElementById('final-score').innerText = `CRÉDITOS MINADOS: ${stats.coins} | NIVEL: ${stats.level}`;
                            document.getElementById('death-screen').classList.remove('hidden');
                        }
                    }
                }

                // Borrar enemigos fuera de pantalla
                if (en.x < -100) enemies.splice(i, 1);
            });
        }
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
