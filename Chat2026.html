<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxiqueen OS - AI Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .maxi-gradient-text {
            background: linear-gradient(90deg, #fde047, #f87171, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-container::-webkit-scrollbar {
            width: 5px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .user-bubble {
            background: rgba(244, 114, 182, 0.2);
            border: 1px solid rgba(244, 114, 182, 0.3);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .loading-dots span {
            animation: blink 1.4s infinite both;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-5xl h-[90vh] glass-panel rounded-3xl overflow-hidden flex flex-col shadow-2xl">
        <!-- Header -->
        <div class="p-6 border-b border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 via-red-500 to-pink-500 flex items-center justify-center shadow-lg shadow-pink-500/20">
                    <span class="text-black font-black text-xs">MQ</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold maxi-gradient-text tracking-tighter">MAXIQUEEN OS</h1>
                    <p class="text-[10px] text-slate-500 uppercase tracking-[0.2em]">SISTEMA DIGITAL HUMANO</p>
                </div>
            </div>
            <div class="flex gap-2">
                <span class="w-3 h-3 rounded-full bg-yellow-500/50"></span>
                <span class="w-3 h-3 rounded-full bg-blue-500/50"></span>
                <span class="w-3 h-3 rounded-full bg-red-500/50"></span>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4 chat-container">
            <div class="ai-bubble p-4 rounded-2xl max-w-[80%] animate-fade-in">
                <p class="text-sm leading-relaxed">Bienvenido a la interfaz de inteligencia de <strong>Maxiqueen OS</strong>. Sistema encriptado y listo para operar. ¿Cómo puedo ayudarte hoy?</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-6 bg-black/20">
            <form id="chat-form" class="relative group">
                <input 
                    type="text" 
                    id="user-input"
                    placeholder="Escribe tu comando o pregunta..."
                    class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 pr-16 focus:outline-none focus:border-pink-500/50 transition-all text-sm placeholder:text-slate-600"
                    autocomplete="off"
                >
                <button 
                    type="submit"
                    class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center transition-colors border border-white/5"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </form>
            <p class="text-[10px] text-center mt-4 text-slate-600">HECHO CON AMOR EN COLOMBIA • POTENCIADO POR GEMINI</p>
        </div>
    </div>

<script>

const chatContainer =
    document.getElementById('chat-container');

const chatForm =
    document.getElementById('chat-form');

const userInput =
    document.getElementById('user-input');


function addMessage(content, isUser = false) {

    const bubble =
        document.createElement('div');

    bubble.className =
        isUser
        ? 'user-bubble p-4 rounded-2xl max-w-[80%]'
        : 'ai-bubble p-4 rounded-2xl max-w-[80%]';

    const textContent =
        content.replace(/\n/g, '<br>');

    bubble.innerHTML =
        `<p class="text-sm leading-relaxed">${textContent}</p>`;

    chatContainer.appendChild(bubble);

    chatContainer.scrollTop =
        chatContainer.scrollHeight;

    return bubble;
}


function showLoading() {

    const loader =
        document.createElement('div');

    loader.id = 'temp-loader';

    loader.className =
        'ai-bubble p-4 rounded-2xl flex gap-1 items-center';

    loader.innerHTML = `
        <div class="loading-dots flex gap-1">
            <span class="w-1.5 h-1.5 bg-pink-500 rounded-full"></span>
            <span class="w-1.5 h-1.5 bg-pink-500 rounded-full"></span>
            <span class="w-1.5 h-1.5 bg-pink-500 rounded-full"></span>
        </div>
    `;

    chatContainer.appendChild(loader);

    chatContainer.scrollTop =
        chatContainer.scrollHeight;
}


async function callBackend(prompt) {

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: prompt
                })

            });

        const data =
            await response.json();

        if(data.error){
            return "❌ " + data.error;
        }

        return data.response;

    } catch(error){

        return "❌ Error conectando con FastAPI";

    }

}


chatForm.addEventListener('submit', async (e) => {

    e.preventDefault();

    const text =
        userInput.value.trim();

    if (!text) return;

    addMessage(text, true);

    userInput.value = '';

    showLoading();

    const response =
        await callBackend(text);

    const loader =
        document.getElementById('temp-loader');

    if(loader)
        loader.remove();

    addMessage(response);

});

</script>
