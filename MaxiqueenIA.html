<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxiQueen OS - Panel de Control Maestro</title>
    <style>
        :root {
            --bg-principal: #0b0b0f;
            --bg-tarjeta: #13131a;
            --bg-hover: #1c1c24;
            --morado-maxi: #8a2be2;
            --morado-brillo: #a04ef6;
            --texto-blanco: #ffffff;
            --texto-mutado: #8f8f9d;
            --borde-sutil: rgba(138, 43, 226, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-blanco);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #13131a 0%, #07070a 100%);
            padding: 2rem;
            border-bottom: 1px solid var(--borde-sutil);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--texto-blanco), var(--morado-brillo));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 span {
            color: var(--morado-brillo);
        }

        .buscador-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        .buscador {
            width: 100%;
            padding: 14px 20px;
            background-color: var(--bg-principal);
            border: 2px solid var(--borde-sutil);
            border-radius: 30px;
            color: var(--texto-blanco);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .buscador:focus {
            border-color: var(--morado-maxi);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
        }

        main {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            flex-grow: 1;
        }

        .seccion-modulo {
            margin-bottom: 3rem;
        }

        .seccion-titulo {
            font-size: 1.4rem;
            color: var(--texto-blanco);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--morado-maxi);
            padding-left: 12px;
        }

        .seccion-titulo span {
            font-size: 0.9rem;
            background-color: var(--borde-sutil);
            color: var(--morado-brillo);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .grid-paginas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .tarjeta-link {
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde-sutil);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: var(--texto-blanco);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .tarjeta-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--morado-maxi), transparent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tarjeta-link:hover {
            background-color: var(--bg-hover);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border-color: rgba(138, 43, 226, 0.4);
        }

        .tarjeta-link:hover::before {
            transform: scaleX(1);
        }

        .nombre-archivo {
            font-weight: 600;
            font-size: 1.05rem;
            word-break: break-all;
            margin-bottom: 0.5rem;
            color: #f3f3f6;
        }

        .descripcion-commit {
            font-size: 0.85rem;
            color: var(--texto-mutado);
            line-height: 1.3;
        }

        .tag-tipo {
            align-self: flex-start;
            margin-top: 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--texto-mutated);
        }

        .html-tag { color: #e44d26; background: rgba(228, 77, 38, 0.1); }
        .py-tag { color: #3776ab; background: rgba(55, 118, 171, 0.1); }
        .js-tag { color: #f7df1e; background: rgba(247, 223, 30, 0.1); }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--texto-mutado);
            font-size: 0.9rem;
            border-top: 1px solid var(--borde-sutil);
            background-color: var(--bg-tarjeta);
        }

        @media (max-width: 768px) {
            .grid-paginas { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>

        const contenedor = document.getElementById('contenedorModulos');
        const buscador = document.getElementById('inputBusqueda');

        // Función para renderizar los elementos en la pantalla
        function renderizarPanel(filtro = '') {
            contenedor.innerHTML = '';
            let hayResultadosGlobales = false;

            baseDeDatosPaginas.forEach(modulo => {
                // Filtramos los archivos dentro de la categoría
                const archivosFiltrados = modulo.archivos.filter(archivo => 
                    archivo.name.toLowerCase().includes(filtro.toLowerCase()) || 
                    archivo.desc.toLowerCase().includes(filtro.toLowerCase())
                );

                if (archivosFiltrados.length > 0) {
                    hayResultadosGlobales = true;
                    
                    // Crear sección de categoría
                    const seccion = document.createElement('section');
                    seccion.className = 'seccion-modulo';

                    const titulo = document.createElement('h2');
                    titulo.className = 'seccion-titulo';
                    titulo.innerHTML = `${modulo.categoria} <span>${archivosFiltrados.length}</span>`;
                    seccion.appendChild(titulo);

                    // Crear contenedor Grid
                    const grid = document.createElement('div');
                    grid.className = 'grid-paginas';

                    archivosFiltrados.forEach(archivo => {
                        const ext = archivo.name.split('.').pop();
                        let tagClass = 'html-tag';
                        if(ext === 'py') tagClass = 'py-tag';
                        if(ext === 'js') tagClass = 'js-tag';

                        const tarjeta = document.createElement('a');
                        tarjeta.className = 'tarjeta-link';
                        tarjeta.href = `./${archivo.name}`; // Apunta a la raíz del proyecto
                        tarjeta.target = '_blank'; // Lo abre en pestaña nueva para no perder el panel
                        
                        tarjeta.innerHTML = `
                            <div>
                                <div class="nombre-archivo">${archivo.name}</div>
                                <div class="descripcion-commit">${archivo.desc}</div>
                            </div>
                            <div class="tag-tipo ${tagClass}">${ext}</div>
                        `;
                        grid.appendChild(tarjeta);
                    });

                    seccion.appendChild(grid);
                    contenedor.appendChild(seccion);
                }
            });

            if (!hayResultadosGlobales) {
                contenedor.innerHTML = `<div style="text-align: center; padding: 3rem; color: var(--texto-mutado);">No se encontraron módulos o archivos con el término "${filtro}".</div>`;
            }
        }

        // Evento del buscador en tiempo real
        buscador.addEventListener('input', (e) => {
            renderizarPanel(e.target.value);
        });

        // Inicializar la carga de la página
        renderizarPanel();
    </script>
